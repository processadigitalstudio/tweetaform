function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

      <div style={{ width: `${pct}%`, height: "100%", background: color || C.ink, borderRadius: 999, transition: "width .3s" }} />

}

function navBtn(disabled) {

// ---------------------------------------------------------------------------
// UN EJERCICIO INDIVIDUAL
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// LOGICA COMPARTIDA: revisar respuesta y saber si ya esta lista para avanzar
// (no se usa para mostrar nada en pantalla mientras se responde — solo al final)
// ---------------------------------------------------------------------------
function checkAnswer(item, answer) {
  if (answer == null) return false;
  if (item.type === "matching") {
    return item.pairs.every((p) => answer[p.left] === p.right);
  }
  if (item.type === "order_words") {
    return typeof answer === "string" && answer.trim() === item.answer.trim();
  }
  if (item.type === "fill_blank") {
    return typeof answer === "string" && answer.trim().toLowerCase() === item.answer.trim().toLowerCase();
  }
  return answer === item.answer;
}

function isAnswerReady(item, answer) {
  if (item.type === "matching") return answer && Object.keys(answer).length === item.pairs.length;
  if (item.type === "order_words") return typeof answer === "string" && answer.trim().length > 0;
  if (item.type === "fill_blank") return typeof answer === "string" && answer.trim().length > 0;
  return answer != null;
}

function formatCorrectAnswer(item) {
  if (item.type === "matching") return item.pairs.map((p) => `${p.left} → ${p.right}`).join("; ");
  if (item.type === "true_false") return item.answer ? "True" : "False";
  return String(item.answer);
}

// ---------------------------------------------------------------------------
// UN EJERCICIO — solo captura la respuesta, no dice si esta bien o mal todavia
// ---------------------------------------------------------------------------
function Exercise({ item, levelColor, t, answer, onChange }) {
  return (
    <div>
      <p style={{ fontFamily: font, color: C.ink, fontSize: 17, marginBottom: 20, lineHeight: 1.5 }}>{item.q}</p>

      {item.type === "image_match" && item.image_url && (
        <img src={item.image_url} alt="" style={{ width: "100%", maxWidth: 240, borderRadius: 12, marginBottom: 16, display: "block" }} />
      )}

      {(item.type === "mcq" || item.type === "image_match") && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
          {item.options.map((opt) => {
            const isSel = answer === opt;
            return (
              <button key={opt} onClick={() => onChange(opt)}
                style={{ fontFamily: font, fontSize: 15, padding: "12px 18px", borderRadius: 12,
                  border: `1.5px solid ${isSel ? C.ink : C.line}`,
                  background: isSel ? C.cream : "#fff",
                  color: C.ink, cursor: "pointer", fontWeight: isSel ? 700 : 400 }}>
                {opt}
              </button>
            );
          })}
        </div>
      )}

      {item.type === "true_false" && (
        <div style={{ display: "flex", gap: 10 }}>
          {[true, false].map((val) => {
            const label = val ? t.trueLabel : t.falseLabel;
            const isSel = answer === val;
            return (
              <button key={label} onClick={() => onChange(val)}
                style={{ fontFamily: font, fontSize: 15, padding: "12px 24px", borderRadius: 12,
                  border: `1.5px solid ${isSel ? C.ink : C.line}`,
                  background: isSel ? C.cream : "#fff",
                  color: C.ink, cursor: "pointer", fontWeight: isSel ? 700 : 400 }}>
                {label}
              </button>
            );
          })}
        </div>
      )}

      {item.type === "fill_blank" && (
        <input value={answer || ""} onChange={(e) => onChange(e.target.value)} placeholder={t.typeAnswer}
          style={{ fontFamily: mono, fontSize: 15, padding: "10px 14px", borderRadius: 10,
            border: `1.5px solid ${C.line}`, background: "#fff", color: C.ink, width: 180 }} />
      )}

      {item.type === "matching" && (
        <MatchingInput item={item} levelColor={levelColor} value={answer || {}} onChange={onChange} />
      )}

      {item.type === "order_words" && (
        <OrderWordsInput item={item} levelColor={levelColor} value={answer || ""} onChange={onChange} />
      )}
    </div>
  );
}

function MatchingInput({ item, levelColor, value, onChange }) {
  const [leftSel, setLeftSel] = useState(null);
  const [rightOptions] = useState(() => shuffle(item.pairs.map((p) => p.right)));

  const pickRight = (right) => {
    if (leftSel == null) return;
    onChange({ ...value, [leftSel]: right });
    setLeftSel(null);
  };

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {item.pairs.map((p) => (
          <button key={p.left} onClick={() => setLeftSel(p.left)}
            style={{ fontFamily: font, fontSize: 14, padding: "10px 14px", borderRadius: 10,
              border: `1.5px solid ${leftSel === p.left ? C.ink : C.line}`,
              background: value[p.left] ? levelColor.soft : "#fff", cursor: "pointer", textAlign: "left" }}>
            {p.left} {value[p.left] ? `→ ${value[p.left]}` : ""}
          </button>
        ))}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {rightOptions.map((r) => {
          const used = Object.values(value).includes(r);
          return (
            <button key={r} disabled={used} onClick={() => pickRight(r)}
              style={{ fontFamily: font, fontSize: 14, padding: "10px 14px", borderRadius: 10,
                border: `1.5px solid ${C.line}`, background: used ? C.cream : "#fff",
                color: used ? C.inkSoft : C.ink, cursor: used ? "default" : "pointer" }}>
              {r}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function OrderWordsInput({ item, levelColor, value, onChange }) {
  const built = value ? value.split(" ").filter(Boolean) : [];
  const [pool, setPool] = useState(() => shuffle(item.words));

  const addWord = (w, i) => {
    const nextBuilt = [...built, w];
    const nextPool = [...pool];
    nextPool.splice(i, 1);
    setPool(nextPool);
    onChange(nextBuilt.join(" "));
  };
  const removeWord = (i) => {
    const word = built[i];
    const nextBuilt = built.filter((_, idx) => idx !== i);
    setPool([...pool, word]);
    onChange(nextBuilt.join(" "));
  };

  return (
    <div>
      <div style={{ minHeight: 46, border: `1.5px dashed ${C.line}`, borderRadius: 10, padding: 10, marginBottom: 14, display: "flex", flexWrap: "wrap", gap: 8 }}>
        {built.map((w, i) => (
          <span key={i} onClick={() => removeWord(i)}
            style={{ fontFamily: font, fontSize: 15, padding: "6px 10px", background: levelColor.soft, borderRadius: 8, cursor: "pointer" }}>
            {w}
          </span>
        ))}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
        {pool.map((w, i) => (
          <button key={i} onClick={() => addWord(w, i)}
            style={{ fontFamily: font, fontSize: 15, padding: "8px 14px", borderRadius: 8, border: `1px solid ${C.line}`, background: "#fff", cursor: "pointer" }}>
            {w}
          </button>
        ))}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// RESUMEN AL FINAL — se ve solo despues de responder todo
// ---------------------------------------------------------------------------
function SummaryScreen({ records, t, levelColor, onContinue }) {
  const correctCount = records.filter((r) => r.correct).length;
  return (
    <div>
      <div style={{ textAlign: "center", marginBottom: 24 }}>
        <p style={{ fontFamily: font, fontSize: 28, color: C.ink, fontWeight: 800, margin: 0 }}>{correctCount}/{records.length}</p>
        <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft }}>{t.correctOutOf(correctCount, records.length)}</p>
      </div>
      {records.map((r, i) => (
        <div key={i} style={{ background: r.correct ? levelColor.soft : C.coralSoft, borderRadius: 12, padding: "12px 16px", marginBottom: 8 }}>
          <p style={{ fontFamily: font, fontSize: 14, color: C.ink, margin: 0 }}>
            <b>{r.correct ? "✓" : "✗"}</b> {r.item.q}
          </p>
          {!r.correct && (
            <p style={{ fontFamily: font, fontSize: 13, color: C.coralText, margin: "4px 0 0" }}>
              {t.answerLabel}{formatCorrectAnswer(r.item)}
            </p>
          )}
        </div>
      ))}
      <button onClick={onContinue} style={{ ...navBtn(false), width: "100%", marginTop: 10 }}>{t.next}</button>
    </div>
  );
}

// ---------------------------------------------------------------------------
// FLUJO: un ejercicio a la vez, sin revelar nada — resumen al final
// ---------------------------------------------------------------------------
function ExerciseFlow({ items, levelColor, t, header, onFinish }) {
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState({}); // {indice: respuesta} — asi el Back conserva lo que ya escribiste
  const [showSummary, setShowSummary] = useState(false);

  if (showSummary) {
    const records = items.map((item, i) => ({ item, answer: answers[i], correct: checkAnswer(item, answers[i]) }));
    const correctCount = records.filter((r) => r.correct).length;
    return (
      <SummaryScreen records={records} t={t} levelColor={levelColor}
        onContinue={() => onFinish(correctCount, records.length)} />
    );
  }

  const item = items[idx];
  const answer = answers[idx] ?? null;
  const ready = isAnswerReady(item, answer);
  const pct = Math.round((idx / items.length) * 100);

  const goNext = () => {
    if (idx + 1 >= items.length) setShowSummary(true);
    else setIdx((i) => i + 1);
  };
  const goBack = () => setIdx((i) => Math.max(0, i - 1));

  return (
    <div>
      {header}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 22 }}>
        <ProgressBar pct={pct} color={levelColor.main} />
        <span style={{ fontFamily: mono, fontSize: 12, color: C.inkSoft, whiteSpace: "nowrap" }}>{idx + 1}/{items.length}</span>
      </div>
      <Exercise key={idx} item={item} levelColor={levelColor} t={t} answer={answer} onChange={(v) => setAnswers({ ...answers, [idx]: v })} />
      <div style={{ display: "flex", gap: 10, marginTop: 24 }}>
        {idx > 0 && (
          <button onClick={goBack} style={{ ...navBtn(false), background: "#fff", color: C.ink, border: `1px solid ${C.line}` }}>
            {t.previous}
          </button>
        )}
        <button disabled={!ready} onClick={goNext} style={{ ...navBtn(!ready), flex: 1 }}>
          {t.next}
        </button>
      </div>
    </div>
  );
}


function LessonHeader({ title, subtitle, levelColor, t }) {
  return (
    <div style={{ marginBottom: 24 }}>
      <div style={{ display: "inline-block", background: levelColor.soft, color: C.ink, fontFamily: mono, fontSize: 11, padding: "3px 10px", borderRadius: 999, marginBottom: 8, letterSpacing: 1, fontWeight: 700 }}>
        {t.lesson}
      </div>
      <h2 style={{ fontFamily: font, color: C.ink, fontSize: 24, margin: 0, fontWeight: 800 }}>{title}</h2>
      {subtitle && <p style={{ fontFamily: font, color: C.inkSoft, fontSize: 14, marginTop: 4 }}>{subtitle}</p>}
    </div>
  );
}

// ---------------- VOCABULARIO ----------------
function VocabLesson({ unit, levelColor, t, onComplete }) {
  const [phase, setPhase] = useState("present");
  const [idx, setIdx] = useState(0);
  const [flip, setFlip] = useState(false);
  const v = unit.vocabulary[idx];

  if (phase === "practice") {
    return (
      <div>
        <LessonHeader title={t.lessons.vocab} subtitle={t.guidedPractice} levelColor={levelColor} t={t} />
        <ExerciseFlow items={unit.vocab_practice} levelColor={levelColor} t={t} onFinish={() => onComplete()} />
      </div>
    );
  }

  const last = idx === unit.vocabulary.length - 1;
  return (
    <div>
      <LessonHeader title={t.lessons.vocab} subtitle={unit.vocab_theme} levelColor={levelColor} t={t} />
      <div onClick={() => setFlip((f) => !f)}
        style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 18, padding: "32px 24px", textAlign: "center",
          cursor: "pointer", minHeight: 200, display: "flex", flexDirection: "column", justifyContent: "center", borderTop: `4px solid ${levelColor.main}` }}>
        {v.image_url && !flip && <img src={v.image_url} alt="" style={{ maxHeight: 120, margin: "0 auto 14px", borderRadius: 10 }} />}
        {!flip ? (
          <p style={{ fontFamily: font, fontSize: 22, color: C.ink, fontWeight: 700 }}>{v.word}</p>
        ) : (
          <>
            <p style={{ fontFamily: font, fontSize: 20, color: C.ink, marginBottom: 8, fontWeight: 700 }}>{v.meaning}</p>
            <p style={{ fontFamily: font, fontSize: 14, color: C.inkSoft, fontStyle: "italic" }}>"{v.example}"</p>
          </>
        )}
      </div>
      <p style={{ textAlign: "center", fontFamily: mono, fontSize: 12, color: C.inkSoft, margin: "14px 0" }}>{idx + 1} / {unit.vocabulary.length}</p>
      <div style={{ display: "flex", gap: 10 }}>
        <button disabled={idx === 0} onClick={() => { setFlip(false); setIdx((i) => i - 1); }}
          style={{ ...navBtn(idx === 0), background: idx === 0 ? C.cream : "#fff", color: idx === 0 ? C.inkSoft : C.ink, border: `1px solid ${C.line}` }}>
          {t.previous}
        </button>
        <button onClick={() => { if (last) setPhase("practice"); else { setFlip(false); setIdx((i) => i + 1); } }}
          style={{ ...navBtn(false), flex: 1 }}>
          {last ? t.guidedPractice : t.next}
        </button>
      </div>
    </div>
  );
}

// ---------------- GRAMATICA ----------------
function GrammarCard({ unit, levelColor, t }) {
  const g = unit.grammar_explanation;
  return (
    <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 14, padding: 20, marginBottom: 20, borderTop: `4px solid ${levelColor.main}` }}>
      <p style={{ fontFamily: font, fontSize: 14, color: C.ink, lineHeight: 1.6, marginBottom: 16 }}>{g.core_rule}</p>
      {g.structure_notes.map((s, i) => (
        <div key={i} style={{ marginBottom: 10, paddingLeft: 12, borderLeft: `3px solid ${levelColor.soft}` }}>
          <span style={{ fontFamily: mono, fontSize: 13, fontWeight: "bold", color: C.ink }}>{s.label}</span>
          <span style={{ fontFamily: font, fontSize: 13, color: C.inkSoft }}> — {s.explanation}</span>
          <p style={{ fontFamily: font, fontSize: 13, fontStyle: "italic", color: C.ink, margin: "2px 0 0" }}>{s.example}</p>
        </div>
      ))}
      <div style={{ marginTop: 14, background: C.coralSoft, borderRadius: 10, padding: "10px 14px" }}>
        <span style={{ fontFamily: font, fontSize: 12, fontWeight: "bold", color: C.coralText }}>{t.commonMistake}</span>
        <span style={{ fontFamily: font, fontSize: 12, color: C.ink }}>{g.common_mistake}</span>
      </div>
    </div>
  );
}

function GrammarLesson({ unit, levelColor, t, onComplete }) {
  const [phase, setPhase] = useState("present");
  const [showHint, setShowHint] = useState(false);

  if (phase === "practice") {
    return (
      <div>
        <LessonHeader title={t.lessons.grammar} subtitle={t.guidedPractice} levelColor={levelColor} t={t} />
        <button onClick={() => setShowHint((h) => !h)}
          style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, padding: "6px 14px", borderRadius: 999, border: `1.5px solid ${levelColor.main}`, background: showHint ? levelColor.soft : "#fff", color: C.ink, cursor: "pointer", marginBottom: 16 }}>
          💡 {showHint ? t.hideHint : t.showHint}
        </button>
        {showHint && <GrammarCard unit={unit} levelColor={levelColor} t={t} />}
        <ExerciseFlow items={unit.grammar_practice} levelColor={levelColor} t={t} onFinish={() => onComplete()} />
      </div>
    );
  }

  return (
    <div>
      <LessonHeader title={t.lessons.grammar} subtitle={unit.grammar_topic} levelColor={levelColor} t={t} />
      <GrammarCard unit={unit} levelColor={levelColor} t={t} />
      <button onClick={() => setPhase("practice")} style={{ ...navBtn(false), width: "100%" }}>{t.guidedPractice}</button>
    </div>
  );

}

  const header = (

      <p style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, marginBottom: 8, letterSpacing: 1 }}>{r.title.toUpperCase()}</p>
      <p style={{ fontFamily: font, fontSize: 15, color: C.ink, lineHeight: 1.7 }}>{r.text}</p>
    </div>
  );

  return (
    <div>
      <LessonHeader title={t.lessons.reading} subtitle={t.textN(textIdx + 1, texts.length)} levelColor={levelColor} t={t} />
      <ExerciseFlow key={textIdx} items={r.questions} levelColor={levelColor} t={t} header={header}

  );
}

// ---------------- LISTENING (reproductor con controles, pegado a las preguntas, con Back) ----------------
function ListeningLesson({ unit, levelColor, t, onComplete }) {
  const [audioIdx, setAudioIdx] = useState(0);
  const audios = unit.listening;
  const l = audios[audioIdx];
  const isLast = audioIdx === audios.length - 1;

  const playTTS = () => {
    try {
      const utter = new SpeechSynthesisUtterance(l.transcript.replace(/^[AB]:\s*/gm, ""));
      utter.lang = "en-US"; utter.rate = 0.95;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(utter);
    } catch (e) {}
  };

  const header = (
    <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 14, padding: 20, marginBottom: 20, textAlign: "center", borderTop: `4px solid ${levelColor.main}` }}>
      <p style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, marginBottom: 10, letterSpacing: 1 }}>{l.title.toUpperCase()}</p>
      {l.audio_url ? (
        <audio controls src={l.audio_url} style={{ width: "100%" }} />
      ) : (
        <button onClick={playTTS} style={{ fontFamily: font, fontSize: 14, padding: "10px 20px", borderRadius: 999, border: "none", background: C.ink, color: "#fff", cursor: "pointer" }}>
          {t.playAudio}
        </button>
      )}
    </div>
  );

  return (
    <div>
      <LessonHeader title={t.lessons.listening} subtitle={t.audioN(audioIdx + 1, audios.length)} levelColor={levelColor} t={t} />
      <ExerciseFlow key={audioIdx} items={l.questions} levelColor={levelColor} t={t} header={header}
        onFinish={() => { if (isLast) onComplete(); else setAudioIdx((i) => i + 1); }} />
    </div>
  );
}


// ---------------- WRITING (solo enviar, sin IA) ----------------
function detectSpanish(text) {
  if (/[áéíóúñ¿¡]/i.test(text)) return true;
  return /\b(el|la|los|las|una|uno|con|para|pero|muy|también|tambien|tengo|estoy|soy|somos|están|estan|hola|gracias|porque|qué|que|cómo|como)\b/i.test(text);
}

function countVocabWordsUsed(unit, text) {
  const lower = text.toLowerCase();
  return unit.vocabulary.filter((v) => {
    const variants = v.word.split("/").map((s) => s.trim().toLowerCase());
    return variants.some((variant) => variant.length > 2 && lower.includes(variant));
  }).length;
}

function WritingLesson({ unit, levelColor, t, lang, onComplete }) {
  const w = unit.writing;
  const [text, setText] = useState("");
  const [sent, setSent] = useState(false);

  const hasSpanish = text.trim().length > 0 && detectSpanish(text);
  const vocabUsed = countVocabWordsUsed(unit, text);
  const enoughVocab = vocabUsed >= 2;
  const canSend = text.trim().length > 0 && !hasSpanish && enoughVocab && !sent;

  return (
    <div>
      <LessonHeader title={t.lessons.writing} levelColor={levelColor} t={t} />
      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 14, padding: 20, marginBottom: 16, borderTop: `4px solid ${levelColor.main}` }}>
        <p style={{ fontFamily: font, fontSize: 14, color: C.ink, marginBottom: 14 }}>{w.prompt[lang] || w.prompt.en}</p>
        <textarea value={text} disabled={sent} onChange={(e) => setText(e.target.value)} rows={5}
          style={{ width: "100%", fontFamily: font, fontSize: 14, padding: 12, borderRadius: 10, border: `1px solid ${C.line}`, boxSizing: "border-box", background: sent ? C.cream : "#fff" }} />

        {!sent && hasSpanish && (
          <p style={{ fontFamily: font, fontSize: 12, color: C.coralText, marginTop: 8 }}>
            {lang === "es" ? "Parece que escribiste en español — recuerda que debe ser en inglés." : "This looks like it's in Spanish — remember it needs to be in English."}
          </p>
        )}
        {!sent && !hasSpanish && text.trim().length > 0 && !enoughVocab && (
          <p style={{ fontFamily: font, fontSize: 12, color: C.coralText, marginTop: 8 }}>
            {lang === "es" ? `Usa al menos 2 palabras del vocabulario de la unidad (llevas ${vocabUsed}).` : `Use at least 2 words from the unit's vocabulary (you have ${vocabUsed}).`}
          </p>
        )}

        <button onClick={() => setSent(true)} disabled={!canSend}
          style={{ ...navBtn(!canSend), marginTop: 10 }}>
          {sent ? t.sent : t.send}
        </button>
      </div>
      <button disabled={!sent} onClick={() => onComplete(text)} style={{ ...navBtn(!sent), width: "100%" }}>{t.finishLesson}</button>
    </div>
  );
}

// ---------------- QUIZ (15 al azar del banco) ----------------
function QuizLesson({ unit, levelColor, t, onComplete }) {
  const [pool] = useState(() => shuffle(unit.quiz_pool).slice(0, unit.quiz_draw_count || 15));
  const [result, setResult] = useState(null);

  if (result) {
    return (
      <div style={{ textAlign: "center", padding: "30px 0" }}>
        <p style={{ fontFamily: font, fontSize: 40, color: C.ink, marginTop: 16, fontWeight: 800 }}>{Math.round((result.c / result.n) * 100)}%</p>
        <p style={{ fontFamily: font, fontSize: 14, color: C.inkSoft, marginBottom: 20 }}>{t.correctOutOf(result.c, result.n)}</p>
        <button onClick={() => onComplete(Math.round((result.c / result.n) * 100))} style={{ ...navBtn(false), padding: "12px 30px" }}>{t.backToUnit}</button>
      </div>
    );
  }

  return (
    <div>
      <LessonHeader title={t.quizTitle} subtitle={t.quizSubtitle} levelColor={levelColor} t={t} />
      <ExerciseFlow items={pool} levelColor={levelColor} t={t} onFinish={(c, n) => setResult({ c, n })} />
    </div>
  );
}

function UnitMap({ unit, levelColor, progress, t, visibleUnits, onOpenLesson, onOpenUnit, onBack }) {
  const doneCount = LESSON_ORDER.filter((k) => progress[k]).length;
  const pct = Math.round((doneCount / LESSON_ORDER.length) * 100);
  const sortedIds = (visibleUnits || []).map((u) => u.unit_id).sort();
  const myIdx = sortedIds.indexOf(unit.unit_id);
  const nextUnit = myIdx >= 0 && myIdx < sortedIds.length - 1 ? visibleUnits.find((u) => u.unit_id === sortedIds[myIdx + 1]) : null;

  return (
    <div>
      <button onClick={onBack} style={{ border: "none", background: "none", padding: 0, color: C.inkSoft, fontFamily: font, fontSize: 14, cursor: "pointer", marginBottom: 18 }}>← {t.levels}</button>
      <span style={{ fontFamily: mono, fontSize: 12, color: levelColor.main, fontWeight: 700 }}>{unit.unit_id}</span>
      <h1 style={{ fontFamily: font, fontSize: 26, color: C.ink, margin: "4px 0", fontWeight: 800 }}>{unit.title}</h1>
      <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft, marginBottom: 14 }}>{unit.can_do}</p>

        <p style={{ fontFamily: mono, fontSize: 12, color: C.inkSoft, margin: 0 }}>{t.percentComplete(pct)}</p>
        {progress.quiz_score != null && (
          <p style={{ fontFamily: mono, fontSize: 12, color: C.ink, fontWeight: 700, margin: 0 }}>Quiz: {progress.quiz_score}%</p>
        )}
      </div>

      {LESSON_ORDER.map((key, i) => {
        const done = progress[key];
        return (
          <div key={key} onClick={() => onOpenLesson(key)}
            style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 0", borderBottom: i < 5 ? `1px solid ${C.line}` : "none", cursor: "pointer" }}>
            <div style={{ width: 40, height: 40, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
              background: done ? C.ink : "#fff", border: `2px solid ${done ? C.ink : levelColor.main}` }}>

            </div>
            <div>
              <p style={{ fontFamily: font, fontSize: 15, fontWeight: 600, color: C.ink, margin: 0 }}>{t.lessons[key]}</p>
              <p style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, margin: 0 }}>{done ? t.completed : t.available}</p>
            </div>
          </div>
        );
      })}

      {doneCount === LESSON_ORDER.length && (
        <div style={{ textAlign: "center", marginTop: 24 }}>
          <Stamp label={unit.level} />
          <p style={{ fontFamily: font, fontSize: 16, color: C.ink, marginTop: 10, fontWeight: 700, marginBottom: 20 }}>{t.unitComplete}</p>
          {nextUnit && (
            <button onClick={() => onOpenUnit(nextUnit)} style={{ ...navBtn(false), padding: "12px 24px" }}>
              {t.nextUnit}: {nextUnit.title} →
            </button>
          )}

      )}
    </div>
  );

// ---------------- DASHBOARD DE MASTER ----------------
function genPass() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  const syms = '!@#$';
  let p = '';
  for (let i = 0; i < 6; i++) p += chars[Math.floor(Math.random() * chars.length)];
  p += syms[Math.floor(Math.random() * syms.length)];
  p += Math.floor(Math.random() * 9) + 1;
  return p;
}

function CreateStudentForm({ onCreated }) {
  const [open, setOpen] = useState(false);
  const [bulkText, setBulkText] = useState("");
  const [results, setResults] = useState([]);
  const [creating, setCreating] = useState(false);
  const LEVELS = ["A1", "A2", "B1", "B2"];

  const parseLines = () =>
    bulkText.split("\n").map((l) => l.trim()).filter(Boolean).map((line) => {
      const parts = line.split(",").map((p) => p.trim());
      return { name: parts[0] || "", email: parts[1] || "", level: (parts[2] || "A1").toUpperCase(), cycleCode: parts[3] || "" };
    });

  const createAll = async () => {
    const rows = parseLines();
    if (rows.length === 0) return;
    setCreating(true);
    const newResults = [];
    const cyclesSeen = new Set();
    for (const row of rows) {
      if (!row.name || !row.email || !LEVELS.includes(row.level)) {
        newResults.push({ ...row, password: "", status: "Fila incompleta o nivel invalido" });
        setResults([...newResults]);
        continue;
      }
      const password = genPass();
      try {
        const secondaryAuth = window.__secondaryApp.auth();
        const cred = await secondaryAuth.createUserWithEmailAndPassword(row.email, password);
        const uid = cred.user.uid;
        await secondaryAuth.signOut();

        // Si trae codigo de ciclo, crea el ciclo (si no existia) y lo asigna al estudiante
        if (row.cycleCode && !cyclesSeen.has(row.cycleCode)) {
          await window.__db.collection("studyCycles").doc(row.cycleCode).set({ name: row.cycleCode }, { merge: true });
          cyclesSeen.add(row.cycleCode);
        }

        await window.__db.collection("users").doc(uid).set({
          role: "student", name: row.name, email: row.email, level: row.level,
          cycleId: row.cycleCode || null, currentPassword: password,
        });
        await logChange("crear_estudiante", row.email, `Nivel: ${row.level}${row.cycleCode ? `, Ciclo: ${row.cycleCode}` : ""}`);
        newResults.push({ ...row, password, status: "✅ Creado" });
      } catch (err) {
        newResults.push({ ...row, password: "", status: err.code === "auth/email-already-in-use" ? "⏭️ Ya existía" : "❌ Error" });
      }
      setResults([...newResults]); // se ve el avance en vivo, fila por fila
    }
    setCreating(false);
    setBulkText("");
    onCreated();
  };

  const downloadCSV = () => {
    const header = "name,email,password,level,cycle,status\n";
    const body = results.map((r) => `${r.name},${r.email},${r.password},${r.level},${r.cycleCode},${r.status}`).join("\n");
    const blob = new Blob([header + body], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "estudiantes_creados.csv"; a.click();
    URL.revokeObjectURL(url);
  };

  if (!open) {
    return <button onClick={() => setOpen(true)} style={{ ...navBtn(false), marginBottom: 16 }}>+ Crear estudiantes</button>;
  }

  return (
    <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
      <p style={{ fontFamily: font, fontSize: 13, color: C.ink, marginBottom: 6 }}>
        Pega una fila por estudiante: <b>Nombre, Correo, Nivel, Ciclo</b> (el ciclo es opcional — ej. C12026-1 — y se crea solo si no existe). La contraseña se genera sola.
      </p>
      <textarea value={bulkText} onChange={(e) => setBulkText(e.target.value)} rows={6}
        placeholder={"Juan Perez, juan.perez@tweetalig.local, A1, C12026-1\nMaria Gomez, maria.gomez@tweetalig.local, A2, C12026-1"}
        style={{ width: "100%", fontFamily: mono, fontSize: 12, padding: 10, borderRadius: 8, border: `1px solid ${C.line}`, boxSizing: "border-box", marginBottom: 10 }} />
      <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
        <button onClick={createAll} disabled={creating || !bulkText.trim()} style={navBtn(creating || !bulkText.trim())}>
          {creating ? `Creando... (${results.length}/${parseLines().length})` : `Crear ${parseLines().length || ""} estudiantes`}
        </button>
        <button onClick={() => setOpen(false)} style={{ ...navBtn(false), background: "#fff", color: C.ink, border: `1px solid ${C.line}` }}>Cerrar</button>
      </div>

      {results.length > 0 && (
        <div>
          <div style={{ maxHeight: 220, overflowY: "auto", border: `1px solid ${C.line}`, borderRadius: 8, marginBottom: 10 }}>
            {results.map((r, i) => (
              <div key={i} style={{ display: "grid", gridTemplateColumns: "1.3fr 1.8fr 0.9fr 0.5fr 0.7fr 1.1fr", gap: 6, padding: "6px 10px", borderBottom: `1px solid ${C.line}`, fontFamily: mono, fontSize: 11 }}>
                <span>{r.name}</span><span>{r.email}</span><span>{r.password}</span><span>{r.level}</span><span>{r.cycleCode}</span><span>{r.status}</span>
              </div>
            ))}
          </div>
          {!creating && (
            <button onClick={downloadCSV} style={navBtn(false)}>⬇️ Descargar CSV con correos y contraseñas</button>
          )}
        </div>
      )}
    </div>
  );
}

          <span style={{ fontFamily: mono, fontSize: 15, color: C.ink }}>{show ? student.currentPassword : "••••••••"}</span>
          <button onClick={() => setShow((s) => !s)} style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, background: "none", border: `1px solid ${C.line}`, borderRadius: 8, padding: "4px 8px", cursor: "pointer" }}>{show ? "Ocultar" : "Ver"}</button>
          <button onClick={copy} style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, background: "none", border: `1px solid ${C.line}`, borderRadius: 8, padding: "4px 8px", cursor: "pointer" }}>Copiar</button>
          <button onClick={() => setEditing(true)} style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, background: "none", border: "none", cursor: "pointer" }}>✏️ Editar</button>
        </div>
      )}
      <p style={{ fontFamily: font, fontSize: 11, color: C.inkSoft, marginTop: 8 }}>
        Esta es la copia que guardamos nosotros. Si algún día se la reseteas desde Firebase Console, actualízala aquí también con "Editar" para que no quede desactualizada.
      </p>
    </div>
  );
}

function AdminDashboard({ t, onLogout }) {
  const [view, setView] = useState("main"); // "main" | "log" | "reports" | "profile" | "cycles"
  const [profileUid, setProfileUid] = useState(null);
  const [students, setStudents] = useState(null);
  const [units, setUnits] = useState(null);
  const [progressByStudent, setProgressByStudent] = useState({});
  const [reloadFlag, setReloadFlag] = useState(0);
  const [logEntries, setLogEntries] = useState(null);
  const [reports, setReports] = useState(null);
  const [cycles, setCycles] = useState(null);
  const LEVELS = ["A1", "A2", "B1", "B2"];

  useEffect(() => {
    (async () => {
      const [usersSnap, unitsSnap, cyclesSnap] = await Promise.all([
        window.__db.collection("users").get(),
        window.__db.collection("units").get(),
        window.__db.collection("studyCycles").orderBy("startDate", "desc").get(),
      ]);
      const allUnits = unitsSnap.docs.map((d) => d.data());
      setUnits(allUnits);
      setCycles(cyclesSnap.docs.map((d) => ({ id: d.id, ...d.data() })));

      const list = usersSnap.docs.map((d) => ({ uid: d.id, ...d.data() })).filter((u) => u.role === "student");

      const withProgress = await Promise.all(list.map(async (s) => {
        const psnap = await window.__db.collection("users").doc(s.uid).collection("progress").get();
        const data = {};
        psnap.docs.forEach((d) => { data[d.id] = d.data(); });
        const levelUnits = s.level === "ALL" ? allUnits : allUnits.filter((u) => u.level === s.level);
        const totalLessons = levelUnits.length * LESSON_ORDER.length;
        const doneLessons = levelUnits.reduce((sum, u) => sum + LESSON_ORDER.filter((k) => data[u.unit_id]?.[k]).length, 0);
        return { ...s, _progress: data, _pct: totalLessons ? Math.round((doneLessons / totalLessons) * 100) : 0 };
      }));

      setStudents(withProgress);
      const pmap = {};
      withProgress.forEach((s) => { pmap[s.uid] = s._progress; });
      setProgressByStudent(pmap);
    })();
  }, [reloadFlag]);

  const setLevel = async (student, level) => {
    await window.__db.collection("users").doc(student.uid).set({ level }, { merge: true });
    await logChange("cambiar_nivel", student.email, `De ${student.level || "sin nivel"} a ${level}`);
    setStudents((prev) => prev.map((s) => (s.uid === student.uid ? { ...s, level } : s)));
  };

  const setEndDate = async (student, endDate) => {
    const ts = dateStrToTimestamp(endDate);
    await window.__db.collection("users").doc(student.uid).set({ enrollmentEndDate: ts }, { merge: true });
    await logChange("cambiar_fecha_fin", student.email, `Nueva fecha: ${endDate || "ninguna"}`);
    setStudents((prev) => prev.map((s) => (s.uid === student.uid ? { ...s, enrollmentEndDate: ts } : s)));
  };

  const setCycle = async (student, cycleId) => {
    await window.__db.collection("users").doc(student.uid).set({ cycleId: cycleId || null }, { merge: true });
    setStudents((prev) => prev.map((s) => (s.uid === student.uid ? { ...s, cycleId } : s)));
  };

  const deleteStudent = async (student) => {
    if (!window.confirm(`¿Eliminar a ${student.name || student.email}? Esto borra su perfil y progreso (no la cuenta de login — eso se borra aparte en Firebase Console).`)) return;
    const psnap = await window.__db.collection("users").doc(student.uid).collection("progress").get();
    await Promise.all(psnap.docs.map((d) => d.ref.delete()));
    await window.__db.collection("users").doc(student.uid).delete();
    await logChange("eliminar_estudiante", student.email, `Nivel que tenia: ${student.level || "sin nivel"}`);
    setStudents((prev) => prev.filter((s) => s.uid !== student.uid));
    setView("main");
  };

  const openLog = async () => {
    setView("log");
    if (!logEntries) {
      const snap = await window.__db.collection("changelog").orderBy("timestamp", "desc").limit(100).get();
      setLogEntries(snap.docs.map((d) => d.data()));
    }
  };

  const openReports = async () => {
    setView("reports");
    if (!reports) {
      const snap = await window.__db.collection("supportReports").orderBy("timestamp", "desc").limit(50).get();
      setReports(snap.docs.map((d) => d.data()));
    }
  };

  const addCycle = async (name, startDate, endDate) => {
    const startTs = dateStrToTimestamp(startDate);
    const endTs = dateStrToTimestamp(endDate);
    await window.__db.collection("studyCycles").doc(name).set({ name, startDate: startTs, endDate: endTs });
    setCycles((prev) => [{ id: name, name, startDate: startTs, endDate: endTs }, ...(prev || []).filter((c) => c.id !== name)]);
  };

  const [cycleFilter, setCycleFilter] = useState("");
  const filteredStudents = students ? students.filter((s) => !cycleFilter || s.cycleId === cycleFilter) : null;

  const downloadStudentsCSV = () => {
    const header = "name,email,level,cycle,enrollment_end_date,total_minutes,overall_pct,unit_id,vocab,grammar,reading,listening,writing,quiz,quiz_score\n";
    const rows = [];
    filteredStudents.forEach((s) => {
      const cycleName = (cycles || []).find((c) => c.id === s.cycleId)?.name || "";
      const p = progressByStudent[s.uid] || {};
      const unitIds = Object.keys(p);
      if (unitIds.length === 0) {
        rows.push([s.name, s.email, s.level || "", cycleName, timestampToDateStr(s.enrollmentEndDate), s.totalMinutes || 0, s._pct, "", "", "", "", "", "", "", ""].join(","));
      } else {
        unitIds.forEach((unitId) => {
          const up = p[unitId];
          rows.push([
            s.name, s.email, s.level || "", cycleName, timestampToDateStr(s.enrollmentEndDate), s.totalMinutes || 0, s._pct,
            unitId, up.vocab ? "1" : "0", up.grammar ? "1" : "0", up.reading ? "1" : "0", up.listening ? "1" : "0", up.writing ? "1" : "0", up.quiz ? "1" : "0", up.quiz_score ?? "",
          ].join(","));
        });
      }
    });
    const blob = new Blob([header + rows.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "progreso_estudiantes.csv"; a.click();
    URL.revokeObjectURL(url);
  };

  const backBtn = (
    <button onClick={() => setView("main")} style={{ fontFamily: font, fontSize: 13, fontWeight: 700, color: C.ink, background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, marginBottom: 16 }}>
      ← Volver al panel
    </button>
  );

  return (
    <div style={{ background: C.bg, minHeight: "100vh", padding: "24px 28px", boxSizing: "border-box" }}>
      <button onClick={onLogout} style={{ position: "absolute", top: 18, right: 24, fontFamily: mono, fontSize: 12, color: C.inkSoft, background: "none", border: "none", cursor: "pointer" }}>
        {t.logout}
      </button>
      <div style={{ maxWidth: 1100, margin: "0 auto", paddingTop: 20 }}>
        <h1 style={{ fontFamily: font, fontSize: 28, color: C.ink, fontWeight: 800, marginBottom: 4 }}>Panel de administración</h1>

        {view !== "main" && backBtn}

        {view === "main" && (
          <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft, margin: 0 }}>
                {filteredStudents ? `${filteredStudents.length} estudiantes${cycleFilter ? ` en ${cycleFilter}` : ""}` : "Cargando..."}
              </p>
              <button onClick={() => setReloadFlag((f) => f + 1)} style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, background: "none", border: `1px solid ${C.line}`, borderRadius: 999, padding: "5px 12px", cursor: "pointer" }}>
                🔄 Actualizar
              </button>
            </div>

            <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap", alignItems: "center" }}>
              <CreateStudentForm onCreated={() => setReloadFlag((f) => f + 1)} />
              <button onClick={openLog} style={{ ...navBtn(false), background: "#fff", color: C.ink, border: `1px solid ${C.line}` }}>📋 Historial de cambios</button>
              <button onClick={openReports} style={{ ...navBtn(false), background: "#fff", color: C.ink, border: `1px solid ${C.line}` }}>🐛 Reportes de problemas</button>
              <button onClick={() => setView("cycles")} style={{ ...navBtn(false), background: "#fff", color: C.ink, border: `1px solid ${C.line}` }}>📅 Ciclos de estudio</button>
              {filteredStudents && filteredStudents.length > 0 && (
                <button onClick={downloadStudentsCSV} style={{ ...navBtn(false), background: "#fff", color: C.ink, border: `1px solid ${C.line}` }}>
                  ⬇️ Descargar CSV{cycleFilter ? ` (${cycleFilter})` : ""}
                </button>
              )}
              {cycles && cycles.length > 0 && (
                <select value={cycleFilter} onChange={(e) => setCycleFilter(e.target.value)}
                  style={{ fontFamily: font, fontSize: 13, padding: 8, borderRadius: 8, border: `1px solid ${C.line}` }}>
                  <option value="">Todos los ciclos</option>
                  {cycles.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              )}
            </div>

            {filteredStudents && filteredStudents.length === 0 && (
              <p style={{ fontFamily: font, fontSize: 14, color: C.inkSoft }}>
                {cycleFilter ? "Ningún estudiante en ese ciclo." : 'Todavía no hay estudiantes. Créalos con "+ Crear estudiantes" arriba.'}
              </p>
            )}

            {filteredStudents && filteredStudents.length > 0 && (
              <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden" }}>
                <div style={{ display: "grid", gridTemplateColumns: "2fr 0.6fr 1fr 0.7fr 1fr 40px", gap: 8, padding: "10px 16px", background: C.cream, fontFamily: mono, fontSize: 10, color: C.inkSoft, letterSpacing: 1 }}>
                  <span>NOMBRE</span><span>NIVEL</span><span>PROGRESO</span><span>TIEMPO</span><span>CICLO</span><span></span>
                </div>
                {filteredStudents.map((s) => (
                  <div key={s.uid} onClick={() => { setProfileUid(s.uid); setView("profile"); }}
                    style={{ display: "grid", gridTemplateColumns: "2fr 0.6fr 1fr 0.7fr 1fr 40px", gap: 8, alignItems: "center", padding: "12px 16px", borderTop: `1px solid ${C.line}`, cursor: "pointer" }}>
                    <div style={{ overflow: "hidden" }}>
                      <p style={{ fontFamily: font, fontSize: 14, fontWeight: 700, color: C.ink, margin: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.name || s.email}</p>
                      <p style={{ fontFamily: mono, fontSize: 10, color: C.inkSoft, margin: 0 }}>{s.email}</p>
                    </div>
                    <span style={{ fontFamily: mono, fontSize: 11, fontWeight: 700, color: LEVEL_COLORS[s.level]?.main || C.inkSoft }}>{s.level || "—"}</span>
                    <div>
                      <ProgressBar pct={s._pct} color={LEVEL_COLORS[s.level]?.main} />
                      <span style={{ fontFamily: mono, fontSize: 10, color: C.inkSoft }}>{s._pct}%</span>
                    </div>
                    <span style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft }}>{s.totalMinutes ? `${s.totalMinutes}m` : "—"}</span>
                    <span style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft }}>{(cycles || []).find((c) => c.id === s.cycleId)?.name || "—"}</span>
                    <span style={{ fontFamily: mono, fontSize: 12, color: C.inkSoft, textAlign: "center" }}>›</span>
                  </div>
                ))}
              </div>
            )}
          </>
        )}

        {view === "profile" && (() => {
          const s = students.find((st) => st.uid === profileUid);
          if (!s) return <p style={{ fontFamily: font, color: C.inkSoft }}>Estudiante no encontrado.</p>;
          const p = progressByStudent[s.uid] || {};
          return (
            <div>
              <h2 style={{ fontFamily: font, fontSize: 22, color: C.ink, fontWeight: 800, marginBottom: 4 }}>{s.name || s.email}</h2>
              <p style={{ fontFamily: mono, fontSize: 13, color: C.inkSoft, marginBottom: 20 }}>{s.email}</p>

              <PasswordBox student={s} onUpdated={(pw) => setStudents((prev) => prev.map((st) => (st.uid === s.uid ? { ...st, currentPassword: pw } : st)))} />

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16, marginBottom: 24 }}>
                <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 14 }}>
                  <p style={{ fontFamily: mono, fontSize: 10, color: C.inkSoft, letterSpacing: 1, marginBottom: 6 }}>PROGRESO</p>
                  <ProgressBar pct={s._pct} color={LEVEL_COLORS[s.level]?.main} />
                  <p style={{ fontFamily: mono, fontSize: 12, color: C.ink, marginTop: 6 }}>{s._pct}%</p>
                </div>
                <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 14 }}>
                  <p style={{ fontFamily: mono, fontSize: 10, color: C.inkSoft, letterSpacing: 1, marginBottom: 6 }}>TIEMPO EN LA PLATAFORMA</p>
                  <p style={{ fontFamily: font, fontSize: 20, color: C.ink, fontWeight: 700, margin: 0 }}>{s.totalMinutes || 0} min</p>
                </div>
                <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 14 }}>
                  <p style={{ fontFamily: mono, fontSize: 10, color: C.inkSoft, letterSpacing: 1, marginBottom: 6 }}>HABILITADO HASTA</p>
                  <input type="date" value={timestampToDateStr(s.enrollmentEndDate)} onChange={(e) => setEndDate(s, e.target.value)}
                    style={{ fontFamily: font, fontSize: 13, padding: 6, borderRadius: 6, border: `1px solid ${C.line}`, width: "100%", boxSizing: "border-box" }} />
                </div>
              </div>

              <p style={{ fontFamily: mono, fontSize: 10, color: C.inkSoft, marginBottom: 6, letterSpacing: 1 }}>NIVEL HABILITADO</p>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
                {LEVELS.map((lvl) => {
                  const selected = s.level === lvl;
                  const lc = LEVEL_COLORS[lvl];
                  return (
                    <button key={lvl} onClick={() => setLevel(s, lvl)}
                      style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, padding: "6px 14px", borderRadius: 999,
                        border: `1.5px solid ${selected ? lc.main : C.line}`, background: selected ? lc.soft : "#fff",
                        color: selected ? C.ink : C.inkSoft, cursor: "pointer" }}>
                      {lvl} {selected ? "✓" : ""}
                    </button>
                  );
                })}
                <button onClick={() => setLevel(s, "ALL")}
                  style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, padding: "6px 14px", borderRadius: 999,
                    border: `1.5px solid ${s.level === "ALL" ? C.ink : C.line}`, background: s.level === "ALL" ? C.cream : "#fff",
                    color: C.ink, cursor: "pointer" }}>
                  TODOS (prueba) {s.level === "ALL" ? "✓" : ""}
                </button>
              </div>

              <p style={{ fontFamily: mono, fontSize: 10, color: C.inkSoft, marginBottom: 6, letterSpacing: 1 }}>CICLO DE ESTUDIO</p>
              <select value={s.cycleId || ""} onChange={(e) => setCycle(s, e.target.value)}
                style={{ fontFamily: font, fontSize: 13, padding: 8, borderRadius: 8, border: `1px solid ${C.line}`, marginBottom: 20 }}>
                <option value="">Sin ciclo asignado</option>
                {(cycles || []).map((c) => <option key={c.id} value={c.id}>{c.name} ({timestampToDateStr(c.startDate)} a {timestampToDateStr(c.endDate)})</option>)}
              </select>

              <button onClick={() => deleteStudent(s)}
                style={{ display: "block", fontFamily: mono, fontSize: 11, color: C.coralText, background: "none", border: `1px solid ${C.coral}`, borderRadius: 8, padding: "6px 12px", cursor: "pointer", marginBottom: 24 }}>
                🗑️ Eliminar estudiante
              </button>

              <p style={{ fontFamily: mono, fontSize: 10, color: C.inkSoft, marginBottom: 10, letterSpacing: 1 }}>PROGRESO POR UNIDAD</p>

              {Object.entries(p).map(([unitId, up]) => (
                <div key={unitId} style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 12, marginBottom: 8 }}>
                  <p style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: C.ink, marginBottom: 4 }}>{unitId}</p>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 6 }}>
                    {LESSON_ORDER.map((k) => (
                      <span key={k} style={{ fontFamily: mono, fontSize: 10, padding: "2px 8px", borderRadius: 999,
                        background: up[k] ? C.ink : "#fff", color: up[k] ? "#fff" : C.inkSoft, border: `1px solid ${C.line}` }}>
                        {k}{up.quiz_score != null && k === "quiz" ? ` ${up.quiz_score}%` : ""}
                      </span>
                    ))}
                  </div>
                  {up.writing_text && (
                    <div style={{ background: C.cream, borderRadius: 8, padding: 10, marginTop: 4 }}>
                      <p style={{ fontFamily: font, fontSize: 12, color: C.inkSoft, marginBottom: 4 }}>Writing enviado:</p>
                      <p style={{ fontFamily: font, fontSize: 13, color: C.ink, whiteSpace: "pre-wrap" }}>{up.writing_text}</p>
                    </div>
                  )}
                </div>
              ))}
            </div>
          );
        })()}

        {view === "log" && (
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 16 }}>
            <p style={{ fontFamily: font, fontSize: 14, fontWeight: 700, color: C.ink, marginBottom: 10 }}>Últimos 100 cambios</p>
            {!logEntries && <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft }}>{t.loading}</p>}
            {logEntries && logEntries.length === 0 && <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft }}>Sin cambios registrados todavía.</p>}
            {logEntries && logEntries.map((e, i) => (
              <div key={i} style={{ padding: "8px 0", borderBottom: `1px solid ${C.line}`, fontFamily: mono, fontSize: 11, color: C.ink }}>
                <b>{e.action}</b> — {e.target} — {e.details} — {e.timestamp ? new Date(e.timestamp.seconds * 1000).toLocaleString() : ""}
              </div>
            ))}
          </div>
        )}

        {view === "reports" && (
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 16 }}>
            <p style={{ fontFamily: font, fontSize: 14, fontWeight: 700, color: C.ink, marginBottom: 10 }}>Últimos 50 reportes</p>
            {!reports && <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft }}>{t.loading}</p>}
            {reports && reports.length === 0 && <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft }}>Sin reportes todavía.</p>}
            {reports && reports.map((r, i) => (
              <div key={i} style={{ padding: "10px 0", borderBottom: `1px solid ${C.line}` }}>
                <p style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, margin: 0 }}>
                  {r.studentName || r.studentEmail} · {r.level} · {r.unitId} · {r.lesson} · {r.timestamp ? new Date(r.timestamp.seconds * 1000).toLocaleString() : ""}
                </p>
                <p style={{ fontFamily: font, fontSize: 13, color: C.ink, margin: "4px 0" }}>{r.description}</p>
                {r.screenshot && <img src={r.screenshot} alt="" style={{ maxWidth: 400, borderRadius: 8, marginTop: 6 }} />}
              </div>
            ))}
          </div>
        )}

        {view === "cycles" && (
          <CyclesPanel cycles={cycles} onAdd={addCycle} />
        )}
      </div>
    </div>
  );
}

function CyclesPanel({ cycles, onAdd }) {
  const [name, setName] = useState("");
  const [startDate, setStartDate] = useState("");
  const [endDate, setEndDate] = useState("");

  const add = () => {
    if (!name.trim() || !startDate || !endDate) return;
    onAdd(name.trim(), startDate, endDate);
    setName(""); setStartDate(""); setEndDate("");
  };

  return (
    <div>
      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
        <p style={{ fontFamily: font, fontSize: 14, fontWeight: 700, color: C.ink, marginBottom: 10 }}>Nuevo ciclo de estudio</p>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
          <input placeholder="Nombre (ej. Ciclo 1 - 2026)" value={name} onChange={(e) => setName(e.target.value)}
            style={{ fontFamily: font, fontSize: 13, padding: 8, borderRadius: 8, border: `1px solid ${C.line}`, flex: "1 1 200px" }} />
          <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)}
            style={{ fontFamily: font, fontSize: 13, padding: 8, borderRadius: 8, border: `1px solid ${C.line}` }} />
          <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)}
            style={{ fontFamily: font, fontSize: 13, padding: 8, borderRadius: 8, border: `1px solid ${C.line}` }} />
        </div>
        <button onClick={add} style={navBtn(false)}>+ Crear ciclo</button>
      </div>

      {(cycles || []).length === 0 && <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft }}>Sin ciclos creados todavía.</p>}
      {(cycles || []).map((c) => (
        <div key={c.id} style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 12, marginBottom: 8 }}>
          <p style={{ fontFamily: font, fontSize: 14, fontWeight: 700, color: C.ink, margin: 0 }}>{c.name}</p>
          <p style={{ fontFamily: mono, fontSize: 12, color: C.inkSoft, margin: 0 }}>{timestampToDateStr(c.startDate)} → {timestampToDateStr(c.endDate)}</p>
        </div>
      ))}
    </div>
  );
}


function ReportProblemForm({ user, profile, activeUnit, activeLesson, onClose }) {
  const [description, setDescription] = useState("");
  const [exercise, setExercise] = useState("");
  const [screenshot, setScreenshot] = useState(null); // base64
  const [screenshotName, setScreenshotName] = useState("");
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [error, setError] = useState(null);

  const onFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 800000) { setError("Image is too large. Please use a smaller screenshot (under 800KB)."); return; }
    setError(null);
    setScreenshotName(file.name);
    const reader = new FileReader();
    reader.onload = () => setScreenshot(reader.result);
    reader.readAsDataURL(file);
  };

  const send = async () => {
    if (!description.trim()) { setError("Please describe the problem."); return; }
    setSending(true);
    setError(null);
    try {
      await window.__db.collection("supportReports").add({
        studentEmail: user.email,
        studentName: profile.name || "",
        level: profile.level || "",
        unitId: activeUnit ? activeUnit.unit_id : "",
        lesson: activeLesson || exercise || "",
        description: description.trim(),
        screenshot: screenshot || null,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setSent(true);
    } catch (err) {
      setError("Something went wrong sending your report. Please try again.");
    }
    setSending(false);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 18 }}>
      <div style={{ background: "#fff", borderRadius: 16, padding: 24, maxWidth: 420, width: "100%", maxHeight: "85vh", overflowY: "auto" }}>
        {sent ? (
          <div style={{ textAlign: "center" }}>
            <p style={{ fontSize: 36, margin: 0 }}>✅</p>
            <p style={{ fontFamily: font, fontSize: 15, color: C.ink, marginBottom: 18 }}>Thank you! Your report was sent.</p>
            <button onClick={onClose} style={navBtn(false)}>Close</button>
          </div>
        ) : (
          <>
            <h3 style={{ fontFamily: font, fontSize: 18, color: C.ink, marginTop: 0 }}>Report a problem</h3>
            <p style={{ fontFamily: font, fontSize: 12, color: C.inkSoft, marginBottom: 14 }}>
              {profile.name || user.email} · Level {profile.level || "—"} · Unit {activeUnit ? activeUnit.unit_id : "—"} · Lesson {activeLesson || "—"}
            </p>
            <textarea value={description} onChange={(e) => setDescription(e.target.value)} rows={4}
              placeholder="Describe what happened..."
              style={{ width: "100%", fontFamily: font, fontSize: 13, padding: 10, borderRadius: 8, border: `1px solid ${C.line}`, boxSizing: "border-box", marginBottom: 10 }} />
            <input type="file" accept="image/*" onChange={onFile}
              style={{ fontFamily: font, fontSize: 12, marginBottom: 10 }} />
            {screenshotName && <p style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, marginBottom: 10 }}>📎 {screenshotName}</p>}
            {error && <p style={{ fontFamily: font, fontSize: 12, color: C.coralText, marginBottom: 10 }}>{error}</p>}
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={send} disabled={sending} style={navBtn(sending)}>{sending ? "Sending..." : "Send report"}</button>
              <button onClick={onClose} style={{ ...navBtn(false), background: "#fff", color: C.ink, border: `1px solid ${C.line}` }}>Cancel</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function LessonCompleteScreen({ t, nextKey, onBackToUnit, onNextLesson }) {
  return (
    <div style={{ textAlign: "center", padding: "50px 0" }}>
      <p style={{ fontSize: 44, margin: 0 }}>✅</p>
      <p style={{ fontFamily: font, fontSize: 20, fontWeight: 800, color: C.ink, margin: "12px 0 28px" }}>{t.lessonComplete}</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, maxWidth: 280, margin: "0 auto" }}>
        {nextKey && (
          <button onClick={onNextLesson} style={navBtn(false)}>{t.nextLesson}: {t.lessons[nextKey]}</button>
        )}
        <button onClick={onBackToUnit} style={{ ...navBtn(false), background: "#fff", color: C.ink, border: `1px solid ${C.line}` }}>
          {t.backToUnit}
        </button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// NAVEGACION POR URL — asi el boton "atras" del navegador funciona de verdad
// ---------------------------------------------------------------------------
function parseHash() {
  const h = window.location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  if (parts[0] === "unit" && parts[1]) {
    return { unitId: decodeURIComponent(parts[1]), lessonKey: parts[2] === "lesson" ? parts[3] : null };
  }
  return { unitId: null, lessonKey: null };
}

function App() {
  const [ready, setReady] = useState(!!window.__firebaseReady);
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null); // { role, enabledLevels, ... }
  const [units, setUnits] = useState(null);
  const [route, setRoute] = useState(() => parseHash()); // { unitId, lessonKey } — viene de la URL
  const [progress, setProgress] = useState({});
  const [allProgress, setAllProgress] = useState(null); // progreso de TODAS las unidades, para la barra general
  const [justFinished, setJustFinished] = useState(null); // que leccion se acaba de terminar (para la pantalla de "Back to unit / Next lesson")
  const [showReport, setShowReport] = useState(false);
  const [accessExpired, setAccessExpired] = useState(false);
  const [lang, setLang] = useState("en");
  const t = STRINGS[lang];

  useEffect(() => {
    if (window.__firebaseReady) { setReady(true); return; }
    const h = () => setReady(true);
    window.addEventListener("firebase-ready", h);
    return () => window.removeEventListener("firebase-ready", h);
  }, []);

  useEffect(() => {
    const onHashChange = () => { setRoute(parseHash()); setJustFinished(null); };
    window.addEventListener("hashchange", onHashChange);
    return () => window.removeEventListener("hashchange", onHashChange);
  }, []);

  // Interceptar tambien el boton FISICO de "atras" del navegador, no solo los botones de la app
  useEffect(() => {
    const onPopState = () => {
      if (route.lessonKey && justFinished !== route.lessonKey) {
        const ok = window.confirm("Your progress in this lesson hasn't been saved yet. If you leave now, you will lose it. Are you sure you want to leave?");
        if (!ok) {
          window.history.pushState(null, "", `#/unit/${encodeURIComponent(route.unitId)}/lesson/${route.lessonKey}`);
        }
      }
    };
    window.addEventListener("popstate", onPopState);
    return () => window.removeEventListener("popstate", onPopState);
  }, [route, justFinished]);

  useEffect(() => {
    if (!ready) return;
    return window.__auth.onAuthStateChanged((u) => { setUser(u); setProfile(null); });
  }, [ready]);

  useEffect(() => {
    if (!user || profile) return;
    (async () => {
      const snap = await window.__db.collection("users").doc(user.uid).get();
      setProfile(snap.exists ? snap.data() : { role: "unknown" });
    })();
  }, [user]);

  // Revisar si al estudiante ya se le vencio el acceso (fecha individual, o si no tiene, la del ciclo)
  useEffect(() => {
    if (!profile || profile.role !== "student") return;
    (async () => {
      try {
        let endTs = profile.enrollmentEndDate || null;
        if (!endTs && profile.cycleId) {
          const csnap = await window.__db.collection("studyCycles").doc(profile.cycleId).get();
          if (csnap.exists) endTs = csnap.data().endDate || null;
        }
        if (endTs) {
          setAccessExpired(new Date() > endTs.toDate());
        }
      } catch (e) { /* si falla esta revision no debe tumbar el resto de la app */ }
    })();
  }, [profile]);

  useEffect(() => {
    if (!user || units) return;
    (async () => {
      const snap = await window.__db.collection("units").get();
      setUnits(snap.docs.map((d) => d.data()));
    })();
  }, [user]);

  useEffect(() => {
    if (!user || profile?.role !== "student" || allProgress) return;
    (async () => {
      const snap = await window.__db.collection("users").doc(user.uid).collection("progress").get();
      const data = {};
      snap.docs.forEach((d) => { data[d.id] = d.data(); });
      setAllProgress(data);
    })();
  }, [user, profile]);

  // Registrar tiempo en la plataforma: suma 1 minuto cada 60 segundos mientras la pestana esta activa
  useEffect(() => {
    if (!user || profile?.role !== "student") return;
    const interval = setInterval(() => {
      if (document.visibilityState === "visible") {
        window.__db.collection("users").doc(user.uid).set(
          { totalMinutes: firebase.firestore.FieldValue.increment(1) },
          { merge: true }
        );
      }
    }, 60000);
    return () => clearInterval(interval);
  }, [user, profile]);

  const activeUnit = units ? units.find((u) => u.unit_id === route.unitId) || null : null;
  const activeLesson = route.lessonKey;

  // cuando cambia la unidad activa (por URL), cargar su progreso
  useEffect(() => {
    if (!user || !route.unitId) { setProgress({}); return; }
    const cached = allProgress && allProgress[route.unitId];
    if (cached) setProgress(cached);
    const ref = window.__db.collection("users").doc(user.uid).collection("progress").doc(route.unitId);
    ref.get().then((snap) => setProgress(snap.exists ? snap.data() : {}));
  }, [route.unitId, user]);

  const confirmLeave = () => {
    if (activeLesson && justFinished !== activeLesson) {
      return window.confirm("Your progress in this lesson hasn't been saved yet. If you leave now, you will lose it. Are you sure you want to leave?");
    }
    return true;
  };
  const goHome = () => { if (confirmLeave()) window.location.hash = "#/"; };
  const goToUnit = (unitId) => { if (confirmLeave()) window.location.hash = `#/unit/${encodeURIComponent(unitId)}`; };
  const goToLesson = (unitId, key) => { window.location.hash = `#/unit/${encodeURIComponent(unitId)}/lesson/${key}`; };

  useEffect(() => {
    const onBeforeUnload = (e) => {
      if (activeLesson && justFinished !== activeLesson) {
        e.preventDefault();
        e.returnValue = "";
      }
    };
    window.addEventListener("beforeunload", onBeforeUnload);
    return () => window.removeEventListener("beforeunload", onBeforeUnload);
  }, [activeLesson, justFinished]);

  const markComplete = async (key, extra) => {
    const next = { ...progress, [key]: true, ...(extra || {}) };
    setProgress(next);
    setAllProgress((prev) => ({ ...(prev || {}), [activeUnit.unit_id]: next }));
    const ref = window.__db.collection("users").doc(user.uid).collection("progress").doc(activeUnit.unit_id);
    await ref.set({ [key]: true, ...(extra || {}) }, { merge: true });
    setJustFinished(key);
  };

  const nextLessonKey = (key) => {
    const i = LESSON_ORDER.indexOf(key);
    return i >= 0 && i < LESSON_ORDER.length - 1 ? LESSON_ORDER[i + 1] : null;
  };

  if (!ready) return <div style={{ padding: 40, fontFamily: font, textAlign: "center" }}>{STRINGS.en.loading}</div>;
  if (!user) return <LoginScreen t={t} />;
  if (!profile) return <div style={{ padding: 40, fontFamily: font, textAlign: "center" }}>{t.loading}</div>;
  if (profile.role === "master") return <AdminDashboard t={t} onLogout={() => window.__auth.signOut()} />;
  if (accessExpired) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.bg, padding: 24 }}>
        <div style={{ textAlign: "center", maxWidth: 440 }}>
          <div style={{ marginBottom: 8 }}><img src={LOGO_SRC} alt="Tweetalig" style={{ height: 34 }} /></div>
          <p style={{ fontSize: 36, margin: 0 }}>🔒</p>
          <h2 style={{ fontFamily: font, fontSize: 20, color: C.ink, fontWeight: 800 }}>Your license has expired</h2>
          <p style={{ fontFamily: font, fontSize: 14, color: C.inkSoft, marginBottom: 20 }}>
            Please contact Tweetalig:
          </p>
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 18, textAlign: "left", fontFamily: font, fontSize: 12, color: C.ink, lineHeight: 1.6, marginBottom: 24 }}>
            <p style={{ fontWeight: 700, marginBottom: 2 }}>CARTAGENA</p>
            <p style={{ margin: "0 0 2px" }}>Avenida Pedro de Heredia, Calle 49A # 31-45, Sector Tesca</p>
            <p style={{ margin: "0 0 2px" }}>Segunda Sede: Cra. 32a #30-22, Esperanza</p>
            <p style={{ margin: "0 0 10px" }}>info.cartaegna@tweetalig.edu.co</p>

            <p style={{ fontWeight: 700, marginBottom: 2 }}>SINCELEJO</p>
            <p style={{ margin: "0 0 2px" }}>Sucre – Barrio La María – Carrera 21 # 25-59</p>
            <p style={{ margin: "0 0 10px" }}>info.sincelejo@tweetalig.edu.co</p>

            <p style={{ fontWeight: 700, marginBottom: 2 }}>BARRANQUILLA</p>
            <p style={{ margin: "0 0 2px" }}>Atlántico – Edificio Royal Cra. 54 # 68-94</p>
            <p style={{ margin: "0 0 10px" }}>info.barranquilla@tweetalig.edu.co</p>

            <p style={{ margin: 0, fontWeight: 700 }}>318 351 6814</p>
          </div>
          <button onClick={() => window.__auth.signOut()} style={navBtn(false)}>{t.logout}</button>
        </div>
      </div>
    );
  }
  if (!units || !allProgress) return <div style={{ padding: 40, fontFamily: font, textAlign: "center" }}>{t.loading}</div>;

  const visibleUnits = profile.level === "ALL" ? units : units.filter((u) => u.level === profile.level);
  const levelColor = activeUnit ? LEVEL_COLORS[activeUnit.level] : null;

  const unitsDone = visibleUnits.filter((u) => {
    const p = allProgress[u.unit_id] || {};
    return LESSON_ORDER.every((k) => p[k]);
  }).length;
  const totalLessons = visibleUnits.length * LESSON_ORDER.length;
  const doneLessons = visibleUnits.reduce((sum, u) => sum + LESSON_ORDER.filter((k) => allProgress[u.unit_id]?.[k]).length, 0);
  const overallProgress = {
    level: profile.level,
    unitsDone,
    unitsTotal: visibleUnits.length,
    pct: totalLessons ? Math.round((doneLessons / totalLessons) * 100) : 0,
  };

  return (
    <div style={{ background: C.bg, minHeight: "100vh", boxSizing: "border-box" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 18px", borderBottom: `1px solid ${C.line}`, background: "#fff" }}>
        <button onClick={goHome}
          style={{ fontFamily: font, fontSize: 15, fontWeight: 700, color: C.ink, background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
          <HomeIcon color={C.ink} /> {t.home}
        </button>
        {activeUnit && (
          <button onClick={() => goToUnit(activeUnit.unit_id)}
            style={{ fontFamily: font, fontSize: 13, fontWeight: 700, color: levelColor.main, background: "none", border: "none", cursor: "pointer" }}>
            {t.unit.toUpperCase()} · {activeUnit.unit_id}
          </button>
        )}
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {!(activeLesson === "quiz") && (
            <button onClick={() => setLang((l) => (l === "en" ? "es" : "en"))}
              style={{ fontFamily: mono, fontSize: 11, fontWeight: 700, padding: "5px 10px", borderRadius: 999, border: `1px solid ${C.line}`, background: "#fff", color: C.ink, cursor: "pointer" }}>
              {lang === "en" ? "ES" : "EN"}
            </button>
          )}
          <button onClick={() => setShowReport(true)}
            style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, background: "none", border: `1px solid ${C.line}`, borderRadius: 999, padding: "5px 10px", cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}>
            <HelpIcon color={C.inkSoft} /> Help
          </button>
          <button onClick={() => confirmLeave() && window.__auth.signOut()}
            style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, background: "none", border: "none", cursor: "pointer" }}>
            {t.logout}
          </button>
        </div>
      </div>
      {showReport && (
        <ReportProblemForm user={user} profile={profile} activeUnit={activeUnit} activeLesson={activeLesson} onClose={() => setShowReport(false)} />
      )}
      <div style={{ padding: "24px 18px" }}>
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        {!activeUnit && <LevelsScreen units={visibleUnits} t={t} name={profile.name} overallProgress={overallProgress} allProgress={allProgress} onOpenUnit={(u) => goToUnit(u.unit_id)} />}
        {activeUnit && !activeLesson && (
          <UnitMap unit={activeUnit} levelColor={levelColor} progress={progress} t={t} visibleUnits={visibleUnits}
            onOpenLesson={(k) => goToLesson(activeUnit.unit_id, k)} onOpenUnit={(u) => goToUnit(u.unit_id)} onBack={goHome} />
        )}
        {activeUnit && activeLesson && (
          <div>
            <button onClick={() => goToUnit(activeUnit.unit_id)} style={{ border: "none", background: "none", padding: 0, color: C.inkSoft, fontFamily: font, fontSize: 14, cursor: "pointer", marginBottom: 16 }}>
              ← {activeUnit.title}
            </button>
            {justFinished === activeLesson ? (
              <LessonCompleteScreen t={t} nextKey={nextLessonKey(activeLesson)}
                onBackToUnit={() => goToUnit(activeUnit.unit_id)}
                onNextLesson={() => goToLesson(activeUnit.unit_id, nextLessonKey(activeLesson))} />
            ) : (
              <>
                {activeLesson === "vocab" && <VocabLesson unit={activeUnit} levelColor={levelColor} t={t} onComplete={() => markComplete("vocab")} />}
                {activeLesson === "grammar" && <GrammarLesson unit={activeUnit} levelColor={levelColor} t={t} onComplete={() => markComplete("grammar")} />}
                {activeLesson === "reading" && <ReadingLesson unit={activeUnit} levelColor={levelColor} t={t} onComplete={() => markComplete("reading")} />}
                {activeLesson === "listening" && <ListeningLesson unit={activeUnit} levelColor={levelColor} t={t} onComplete={() => markComplete("listening")} />}
                {activeLesson === "writing" && <WritingLesson unit={activeUnit} levelColor={levelColor} t={t} lang={lang} onComplete={(text) => markComplete("writing", { writing_text: text, writing_submitted_at: new Date().toISOString() })} />}
                {activeLesson === "quiz" && <QuizLesson unit={activeUnit} levelColor={levelColor} t={t} onComplete={(score) => markComplete("quiz", { quiz_score: score })} />}
                <button onClick={() => goToUnit(activeUnit.unit_id)}
                  style={{ ...navBtn(false), width: "100%", marginTop: 30, background: "#fff", color: C.ink, border: `1px solid ${C.line}` }}>
                  ← {t.backToUnit}
                </button>
              </>
            )}
          </div>
        )}
      </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
