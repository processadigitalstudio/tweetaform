const LESSON_ORDER = ["vocab", "grammar", "reading", "listening", "writing", "quiz"];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------------------------------------------------------------------------
// BARRA DE PROGRESO (horizontal, no circular)
// ---------------------------------------------------------------------------
function ProgressBar({ pct, color }) {
  return (
    <div style={{ width: "100%", height: 8, background: C.line, borderRadius: 999, overflow: "hidden" }}>
      <div style={{ width: `${pct}%`, height: "100%", background: color || C.ink, borderRadius: 999, transition: "width .3s" }} />
    </div>
  );
}

function Stamp({ label }) {
  return (
    <svg width="130" height="130" viewBox="0 0 130 130" style={{ transform: "rotate(-8deg)" }}>
      <circle cx="65" cy="65" r="58" fill={C.goldSoft} stroke={C.gold} strokeWidth="4" />
      <circle cx="65" cy="65" r="46" fill="none" stroke={C.gold} strokeWidth="2" />
      <text x="65" y="60" textAnchor="middle" fontWeight="800" fontSize="26" fill={C.ink}>{label}</text>
      <text x="65" y="84" textAnchor="middle" fontWeight="700" fontSize="12" fill={C.ink} letterSpacing="2">DONE</text>
    </svg>
  );
}

function navBtn(disabled) {
  return { fontFamily: font, fontSize: 14, padding: "10px 18px", borderRadius: 10, border: "none",
    background: disabled ? C.cream : C.ink, color: disabled ? C.inkSoft : "#fff", cursor: disabled ? "default" : "pointer" };
}

// ---------------------------------------------------------------------------
// UN EJERCICIO INDIVIDUAL
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// LOGICA COMPARTIDA: revisar respuesta y saber si ya esta lista para avanzar
// (no se usa para mostrar nada en pantalla mientras se responde — solo al final)
// ---------------------------------------------------------------------------
function checkAnswer(item, answer) {
  if (answer == null) return false;
  if (item.type === "matching") {
    return item.pairs.every((p) => answer[p.left] === p.right);
  }
  if (item.type === "order_words") {
    return typeof answer === "string" && answer.trim() === item.answer.trim();
  }
  if (item.type === "fill_blank") {
    return typeof answer === "string" && answer.trim().toLowerCase() === item.answer.trim().toLowerCase();
  }
  return answer === item.answer;
}

function isAnswerReady(item, answer) {
  if (item.type === "matching") return answer && Object.keys(answer).length === item.pairs.length;
  if (item.type === "order_words") return typeof answer === "string" && answer.trim().length > 0;
  if (item.type === "fill_blank") return typeof answer === "string" && answer.trim().length > 0;
  return answer != null;
}

function formatCorrectAnswer(item) {
  if (item.type === "matching") return item.pairs.map((p) => `${p.left} → ${p.right}`).join("; ");
  if (item.type === "true_false") return item.answer ? "True" : "False";
  return String(item.answer);
}

// ---------------------------------------------------------------------------
// UN EJERCICIO — solo captura la respuesta, no dice si esta bien o mal todavia
// ---------------------------------------------------------------------------
function Exercise({ item, levelColor, t, answer, onChange }) {
  return (
    <div>
      <p style={{ fontFamily: font, color: C.ink, fontSize: 17, marginBottom: 20, lineHeight: 1.5 }}>{item.q}</p>

      {item.type === "image_match" && item.image_url && (
        <img src={item.image_url} alt="" style={{ width: "100%", maxWidth: 240, borderRadius: 12, marginBottom: 16, display: "block" }} />
      )}

      {(item.type === "mcq" || item.type === "image_match") && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
          {item.options.map((opt) => {
            const isSel = answer === opt;
            return (
              <button key={opt} onClick={() => onChange(opt)}
                style={{ fontFamily: font, fontSize: 15, padding: "12px 18px", borderRadius: 12,
                  border: `1.5px solid ${isSel ? C.ink : C.line}`,
                  background: isSel ? C.cream : "#fff",
                  color: C.ink, cursor: "pointer", fontWeight: isSel ? 700 : 400 }}>
                {opt}
              </button>
            );
          })}
        </div>
      )}

      {item.type === "true_false" && (
        <div style={{ display: "flex", gap: 10 }}>
          {[true, false].map((val) => {
            const label = val ? t.trueLabel : t.falseLabel;
            const isSel = answer === val;
            return (
              <button key={label} onClick={() => onChange(val)}
                style={{ fontFamily: font, fontSize: 15, padding: "12px 24px", borderRadius: 12,
                  border: `1.5px solid ${isSel ? C.ink : C.line}`,
                  background: isSel ? C.cream : "#fff",
                  color: C.ink, cursor: "pointer", fontWeight: isSel ? 700 : 400 }}>
                {label}
              </button>
            );
          })}
        </div>
      )}

      {item.type === "fill_blank" && (
        <input value={answer || ""} onChange={(e) => onChange(e.target.value)} placeholder={t.typeAnswer}
          style={{ fontFamily: mono, fontSize: 15, padding: "10px 14px", borderRadius: 10,
            border: `1.5px solid ${C.line}`, background: "#fff", color: C.ink, width: 180 }} />
      )}

      {item.type === "matching" && (
        <MatchingInput item={item} levelColor={levelColor} value={answer || {}} onChange={onChange} />
      )}

      {item.type === "order_words" && (
        <OrderWordsInput item={item} levelColor={levelColor} value={answer || ""} onChange={onChange} />
      )}
    </div>
  );
}

function MatchingInput({ item, levelColor, value, onChange }) {
  const [leftSel, setLeftSel] = useState(null);
  const [rightOptions] = useState(() => shuffle(item.pairs.map((p) => p.right)));

  const pickRight = (right) => {
    if (leftSel == null) return;
    onChange({ ...value, [leftSel]: right });
    setLeftSel(null);
  };

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {item.pairs.map((p) => (
          <button key={p.left} onClick={() => setLeftSel(p.left)}
            style={{ fontFamily: font, fontSize: 14, padding: "10px 14px", borderRadius: 10,
              border: `1.5px solid ${leftSel === p.left ? C.ink : C.line}`,
              background: value[p.left] ? levelColor.soft : "#fff", cursor: "pointer", textAlign: "left" }}>
            {p.left} {value[p.left] ? `→ ${value[p.left]}` : ""}
          </button>
        ))}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {rightOptions.map((r) => {
          const used = Object.values(value).includes(r);
          return (
            <button key={r} disabled={used} onClick={() => pickRight(r)}
              style={{ fontFamily: font, fontSize: 14, padding: "10px 14px", borderRadius: 10,
                border: `1.5px solid ${C.line}`, background: used ? C.cream : "#fff",
                color: used ? C.inkSoft : C.ink, cursor: used ? "default" : "pointer" }}>
              {r}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function OrderWordsInput({ item, levelColor, value, onChange }) {
  const built = value ? value.split(" ").filter(Boolean) : [];
  const [pool, setPool] = useState(() => shuffle(item.words));

  const addWord = (w, i) => {
    const nextBuilt = [...built, w];
    const nextPool = [...pool];
    nextPool.splice(i, 1);
    setPool(nextPool);
    onChange(nextBuilt.join(" "));
  };
  const removeWord = (i) => {
    const word = built[i];
    const nextBuilt = built.filter((_, idx) => idx !== i);
    setPool([...pool, word]);
    onChange(nextBuilt.join(" "));
  };

  return (
    <div>
      <div style={{ minHeight: 46, border: `1.5px dashed ${C.line}`, borderRadius: 10, padding: 10, marginBottom: 14, display: "flex", flexWrap: "wrap", gap: 8 }}>
        {built.map((w, i) => (
          <span key={i} onClick={() => removeWord(i)}
            style={{ fontFamily: font, fontSize: 15, padding: "6px 10px", background: levelColor.soft, borderRadius: 8, cursor: "pointer" }}>
            {w}
          </span>
        ))}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
        {pool.map((w, i) => (
          <button key={i} onClick={() => addWord(w, i)}
            style={{ fontFamily: font, fontSize: 15, padding: "8px 14px", borderRadius: 8, border: `1px solid ${C.line}`, background: "#fff", cursor: "pointer" }}>
            {w}
          </button>
        ))}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// RESUMEN AL FINAL — se ve solo despues de responder todo
// ---------------------------------------------------------------------------
function SummaryScreen({ records, t, levelColor, onContinue }) {
  const correctCount = records.filter((r) => r.correct).length;
  return (
    <div>
      <div style={{ textAlign: "center", marginBottom: 24 }}>
        <p style={{ fontFamily: font, fontSize: 28, color: C.ink, fontWeight: 800, margin: 0 }}>{correctCount}/{records.length}</p>
        <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft }}>{t.correctOutOf(correctCount, records.length)}</p>
      </div>
      {records.map((r, i) => (
        <div key={i} style={{ background: r.correct ? levelColor.soft : C.coralSoft, borderRadius: 12, padding: "12px 16px", marginBottom: 8 }}>
          <p style={{ fontFamily: font, fontSize: 14, color: C.ink, margin: 0 }}>
            <b>{r.correct ? "✓" : "✗"}</b> {r.item.q}
          </p>
          {!r.correct && (
            <p style={{ fontFamily: font, fontSize: 13, color: C.coralText, margin: "4px 0 0" }}>
              {t.answerLabel}{formatCorrectAnswer(r.item)}
            </p>
          )}
        </div>
      ))}
      <button onClick={onContinue} style={{ ...navBtn(false), width: "100%", marginTop: 10 }}>{t.next}</button>
    </div>
  );
}

// ---------------------------------------------------------------------------
// FLUJO: un ejercicio a la vez, sin revelar nada — resumen al final
// ---------------------------------------------------------------------------
function ExerciseFlow({ items, levelColor, t, header, onFinish }) {
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState({}); // {indice: respuesta} — asi el Back conserva lo que ya escribiste
  const [showSummary, setShowSummary] = useState(false);

  if (showSummary) {
    const records = items.map((item, i) => ({ item, answer: answers[i], correct: checkAnswer(item, answers[i]) }));
    const correctCount = records.filter((r) => r.correct).length;
    return (
      <SummaryScreen records={records} t={t} levelColor={levelColor}
        onContinue={() => onFinish(correctCount, records.length)} />
    );
  }

  const item = items[idx];
  const answer = answers[idx] ?? null;
  const ready = isAnswerReady(item, answer);
  const pct = Math.round((idx / items.length) * 100);

  const goNext = () => {
    if (idx + 1 >= items.length) setShowSummary(true);
    else setIdx((i) => i + 1);
  };
  const goBack = () => setIdx((i) => Math.max(0, i - 1));

  return (
    <div>
      {header}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 22 }}>
        <ProgressBar pct={pct} color={levelColor.main} />
        <span style={{ fontFamily: mono, fontSize: 12, color: C.inkSoft, whiteSpace: "nowrap" }}>{idx + 1}/{items.length}</span>
      </div>
      <Exercise key={idx} item={item} levelColor={levelColor} t={t} answer={answer} onChange={(v) => setAnswers({ ...answers, [idx]: v })} />
      <div style={{ display: "flex", gap: 10, marginTop: 24 }}>
        {idx > 0 && (
          <button onClick={goBack} style={{ ...navBtn(false), background: "#fff", color: C.ink, border: `1px solid ${C.line}` }}>
            {t.previous}
          </button>
        )}
        <button disabled={!ready} onClick={goNext} style={{ ...navBtn(!ready), flex: 1 }}>
          {t.next}
        </button>
      </div>
    </div>
  );
}


function LessonHeader({ title, subtitle, levelColor, t }) {
  return (
    <div style={{ marginBottom: 24 }}>
      <div style={{ display: "inline-block", background: levelColor.soft, color: C.ink, fontFamily: mono, fontSize: 11, padding: "3px 10px", borderRadius: 999, marginBottom: 8, letterSpacing: 1, fontWeight: 700 }}>
        {t.lesson}
      </div>
      <h2 style={{ fontFamily: font, color: C.ink, fontSize: 24, margin: 0, fontWeight: 800 }}>{title}</h2>
      {subtitle && <p style={{ fontFamily: font, color: C.inkSoft, fontSize: 14, marginTop: 4 }}>{subtitle}</p>}
    </div>
  );
}

// ---------------- VOCABULARIO ----------------
function VocabLesson({ unit, levelColor, t, onComplete }) {
  const [phase, setPhase] = useState("present");
  const [idx, setIdx] = useState(0);
  const [flip, setFlip] = useState(false);
  const v = unit.vocabulary[idx];

  if (phase === "practice") {
    return (
      <div>
        <LessonHeader title={t.lessons.vocab} subtitle={t.guidedPractice} levelColor={levelColor} t={t} />
        <ExerciseFlow items={unit.vocab_practice} levelColor={levelColor} t={t} onFinish={() => onComplete()} />
      </div>
    );
  }

  const last = idx === unit.vocabulary.length - 1;
  return (
    <div>
      <LessonHeader title={t.lessons.vocab} subtitle={unit.vocab_theme} levelColor={levelColor} t={t} />
      <div onClick={() => setFlip((f) => !f)}
        style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 18, padding: "32px 24px", textAlign: "center",
          cursor: "pointer", minHeight: 200, display: "flex", flexDirection: "column", justifyContent: "center", borderTop: `4px solid ${levelColor.main}` }}>
        {v.image_url && !flip && <img src={v.image_url} alt="" style={{ maxHeight: 120, margin: "0 auto 14px", borderRadius: 10 }} />}
        {!flip ? (
          <p style={{ fontFamily: font, fontSize: 22, color: C.ink, fontWeight: 700 }}>{v.word}</p>
        ) : (
          <>
            <p style={{ fontFamily: font, fontSize: 20, color: C.ink, marginBottom: 8, fontWeight: 700 }}>{v.meaning}</p>
            <p style={{ fontFamily: font, fontSize: 14, color: C.inkSoft, fontStyle: "italic" }}>"{v.example}"</p>
          </>
        )}
      </div>
      <p style={{ textAlign: "center", fontFamily: mono, fontSize: 12, color: C.inkSoft, margin: "14px 0" }}>{idx + 1} / {unit.vocabulary.length}</p>
      <div style={{ display: "flex", gap: 10 }}>
        <button disabled={idx === 0} onClick={() => { setFlip(false); setIdx((i) => i - 1); }}
          style={{ ...navBtn(idx === 0), background: idx === 0 ? C.cream : "#fff", color: idx === 0 ? C.inkSoft : C.ink, border: `1px solid ${C.line}` }}>
          {t.previous}
        </button>
        <button onClick={() => { if (last) setPhase("practice"); else { setFlip(false); setIdx((i) => i + 1); } }}
          style={{ ...navBtn(false), flex: 1 }}>
          {last ? t.guidedPractice : t.next}
        </button>
      </div>
    </div>
  );
}

// ---------------- GRAMATICA ----------------
function GrammarLesson({ unit, levelColor, t, onComplete }) {
  const [phase, setPhase] = useState("present");
  const g = unit.grammar_explanation;

  if (phase === "practice") {
    return (
      <div>
        <LessonHeader title={t.lessons.grammar} subtitle={t.guidedPractice} levelColor={levelColor} t={t} />
        <ExerciseFlow items={unit.grammar_practice} levelColor={levelColor} t={t} onFinish={() => onComplete()} />
      </div>
    );
  }

  return (
    <div>
      <LessonHeader title={t.lessons.grammar} subtitle={unit.grammar_topic} levelColor={levelColor} t={t} />
      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 14, padding: 20, marginBottom: 20, borderTop: `4px solid ${levelColor.main}` }}>
        <p style={{ fontFamily: font, fontSize: 14, color: C.ink, lineHeight: 1.6, marginBottom: 16 }}>{g.core_rule}</p>
        {g.structure_notes.map((s, i) => (
          <div key={i} style={{ marginBottom: 10, paddingLeft: 12, borderLeft: `3px solid ${levelColor.soft}` }}>
            <span style={{ fontFamily: mono, fontSize: 13, fontWeight: "bold", color: C.ink }}>{s.label}</span>
            <span style={{ fontFamily: font, fontSize: 13, color: C.inkSoft }}> — {s.explanation}</span>
            <p style={{ fontFamily: font, fontSize: 13, fontStyle: "italic", color: C.ink, margin: "2px 0 0" }}>{s.example}</p>
          </div>
        ))}
        <div style={{ marginTop: 14, background: C.coralSoft, borderRadius: 10, padding: "10px 14px" }}>
          <span style={{ fontFamily: font, fontSize: 12, fontWeight: "bold", color: C.coralText }}>{t.commonMistake}</span>
          <span style={{ fontFamily: font, fontSize: 12, color: C.ink }}>{g.common_mistake}</span>
        </div>
      </div>
      <button onClick={() => setPhase("practice")} style={{ ...navBtn(false), width: "100%" }}>{t.guidedPractice}</button>
    </div>
  );
}

// ---------------- READING (texto pegado a las preguntas, con Back) ----------------
function ReadingLesson({ unit, levelColor, t, onComplete }) {
  const [textIdx, setTextIdx] = useState(0);
  const texts = unit.reading;
  const r = texts[textIdx];
  const isLast = textIdx === texts.length - 1;

  const header = (
    <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 14, padding: 20, marginBottom: 20, borderTop: `4px solid ${levelColor.main}` }}>
      <p style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, marginBottom: 8, letterSpacing: 1 }}>{r.title.toUpperCase()}</p>
      <p style={{ fontFamily: font, fontSize: 15, color: C.ink, lineHeight: 1.7 }}>{r.text}</p>
    </div>
  );

  return (
    <div>
      <LessonHeader title={t.lessons.reading} subtitle={t.textN(textIdx + 1, texts.length)} levelColor={levelColor} t={t} />
      <ExerciseFlow key={textIdx} items={r.questions} levelColor={levelColor} t={t} header={header}
        onFinish={() => { if (isLast) onComplete(); else setTextIdx((i) => i + 1); }} />
    </div>
  );
}

// ---------------- LISTENING (reproductor con controles, pegado a las preguntas, con Back) ----------------
function ListeningLesson({ unit, levelColor, t, onComplete }) {
  const [audioIdx, setAudioIdx] = useState(0);
  const audios = unit.listening;
  const l = audios[audioIdx];
  const isLast = audioIdx === audios.length - 1;

  const playTTS = () => {
    try {
      const utter = new SpeechSynthesisUtterance(l.transcript.replace(/^[AB]:\s*/gm, ""));
      utter.lang = "en-US"; utter.rate = 0.95;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(utter);
    } catch (e) {}
  };

  const header = (
    <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 14, padding: 20, marginBottom: 20, textAlign: "center", borderTop: `4px solid ${levelColor.main}` }}>
      <p style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, marginBottom: 10, letterSpacing: 1 }}>{l.title.toUpperCase()}</p>
      {l.audio_url ? (
        <audio controls src={l.audio_url} style={{ width: "100%" }} />
      ) : (
        <button onClick={playTTS} style={{ fontFamily: font, fontSize: 14, padding: "10px 20px", borderRadius: 999, border: "none", background: C.ink, color: "#fff", cursor: "pointer" }}>
          {t.playAudio}
        </button>
      )}
    </div>
  );

  return (
    <div>
      <LessonHeader title={t.lessons.listening} subtitle={t.audioN(audioIdx + 1, audios.length)} levelColor={levelColor} t={t} />
      <ExerciseFlow key={audioIdx} items={l.questions} levelColor={levelColor} t={t} header={header}
        onFinish={() => { if (isLast) onComplete(); else setAudioIdx((i) => i + 1); }} />
    </div>
  );
}


// ---------------- WRITING (solo enviar, sin IA) ----------------
function detectSpanish(text) {
  if (/[áéíóúñ¿¡]/i.test(text)) return true;
  return /\b(el|la|los|las|una|uno|con|para|pero|muy|también|tambien|tengo|estoy|soy|somos|están|estan|hola|gracias|porque|qué|que|cómo|como)\b/i.test(text);
}

function countVocabWordsUsed(unit, text) {
  const lower = text.toLowerCase();
  return unit.vocabulary.filter((v) => {
    const variants = v.word.split("/").map((s) => s.trim().toLowerCase());
    return variants.some((variant) => variant.length > 2 && lower.includes(variant));
  }).length;
}

function WritingLesson({ unit, levelColor, t, lang, onComplete }) {
  const w = unit.writing;
  const [text, setText] = useState("");
  const [sent, setSent] = useState(false);

  const hasSpanish = text.trim().length > 0 && detectSpanish(text);
  const vocabUsed = countVocabWordsUsed(unit, text);
  const enoughVocab = vocabUsed >= 2;
  const canSend = text.trim().length > 0 && !hasSpanish && enoughVocab && !sent;

  return (
    <div>
      <LessonHeader title={t.lessons.writing} levelColor={levelColor} t={t} />
      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 14, padding: 20, marginBottom: 16, borderTop: `4px solid ${levelColor.main}` }}>
        <p style={{ fontFamily: font, fontSize: 14, color: C.ink, marginBottom: 14 }}>{w.prompt[lang] || w.prompt.en}</p>
        <textarea value={text} disabled={sent} onChange={(e) => setText(e.target.value)} rows={5}
          style={{ width: "100%", fontFamily: font, fontSize: 14, padding: 12, borderRadius: 10, border: `1px solid ${C.line}`, boxSizing: "border-box", background: sent ? C.cream : "#fff" }} />

        {!sent && hasSpanish && (
          <p style={{ fontFamily: font, fontSize: 12, color: C.coralText, marginTop: 8 }}>
            {lang === "es" ? "Parece que escribiste en español — recuerda que debe ser en inglés." : "This looks like it's in Spanish — remember it needs to be in English."}
          </p>
        )}
        {!sent && !hasSpanish && text.trim().length > 0 && !enoughVocab && (
          <p style={{ fontFamily: font, fontSize: 12, color: C.coralText, marginTop: 8 }}>
            {lang === "es" ? `Usa al menos 2 palabras del vocabulario de la unidad (llevas ${vocabUsed}).` : `Use at least 2 words from the unit's vocabulary (you have ${vocabUsed}).`}
          </p>
        )}

        <button onClick={() => setSent(true)} disabled={!canSend}
          style={{ ...navBtn(!canSend), marginTop: 10 }}>
          {sent ? t.sent : t.send}
        </button>
      </div>
      <button disabled={!sent} onClick={() => onComplete(text)} style={{ ...navBtn(!sent), width: "100%" }}>{t.finishLesson}</button>
    </div>
  );
}

// ---------------- QUIZ (15 al azar del banco) ----------------
function QuizLesson({ unit, levelColor, t, onComplete }) {
  const [pool] = useState(() => shuffle(unit.quiz_pool).slice(0, unit.quiz_draw_count || 15));
  const [result, setResult] = useState(null);

  if (result) {
    return (
      <div style={{ textAlign: "center", padding: "30px 0" }}>
        <Stamp label={unit.level} />
        <p style={{ fontFamily: font, fontSize: 30, color: C.ink, marginTop: 16, fontWeight: 800 }}>{Math.round((result.c / result.n) * 100)}%</p>
        <p style={{ fontFamily: font, fontSize: 14, color: C.inkSoft, marginBottom: 20 }}>{t.correctOutOf(result.c, result.n)}</p>
        <button onClick={() => onComplete(Math.round((result.c / result.n) * 100))} style={{ ...navBtn(false), padding: "12px 30px" }}>{t.backToUnit}</button>
      </div>
    );
  }

  return (
    <div>
      <LessonHeader title={t.quizTitle} subtitle={t.quizSubtitle} levelColor={levelColor} t={t} />
      <ExerciseFlow items={pool} levelColor={levelColor} t={t} onFinish={(c, n) => setResult({ c, n })} />
    </div>
  );
}

// ---------------- MAPA DE UNIDAD ----------------
function UnitMap({ unit, levelColor, progress, t, onOpenLesson, onBack }) {
  const doneCount = LESSON_ORDER.filter((k) => progress[k]).length;
  const pct = Math.round((doneCount / LESSON_ORDER.length) * 100);

  return (
    <div>
      <button onClick={onBack} style={{ border: "none", background: "none", padding: 0, color: C.inkSoft, fontFamily: font, fontSize: 14, cursor: "pointer", marginBottom: 18 }}>← {t.levels}</button>
      <span style={{ fontFamily: mono, fontSize: 12, color: levelColor.main, fontWeight: 700 }}>{unit.unit_id}</span>
      <h1 style={{ fontFamily: font, fontSize: 26, color: C.ink, margin: "4px 0", fontWeight: 800 }}>{unit.title}</h1>
      <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft, marginBottom: 14 }}>{unit.can_do}</p>
      <ProgressBar pct={pct} color={levelColor.main} />
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, marginBottom: 28 }}>
        <p style={{ fontFamily: mono, fontSize: 12, color: C.inkSoft, margin: 0 }}>{t.percentComplete(pct)}</p>
        {progress.quiz_score != null && (
          <p style={{ fontFamily: mono, fontSize: 12, color: C.ink, fontWeight: 700, margin: 0 }}>Quiz: {progress.quiz_score}%</p>
        )}
      </div>

      {LESSON_ORDER.map((key, i) => {
        const done = progress[key];
        const isQuiz = key === "quiz";
        const locked = isQuiz && !LESSON_ORDER.slice(0, 5).every((k) => progress[k]);
        return (
          <div key={key} onClick={() => !locked && onOpenLesson(key)}
            style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 0", borderBottom: i < 5 ? `1px solid ${C.line}` : "none", cursor: locked ? "default" : "pointer", opacity: locked ? 0.5 : 1 }}>
            <div style={{ width: 40, height: 40, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
              background: done ? C.ink : "#fff", border: `2px solid ${done ? C.ink : levelColor.main}` }}>
              <span style={{ color: done ? "#fff" : levelColor.main, fontFamily: font, fontWeight: 700 }}>{done ? "✓" : i + 1}</span>
            </div>
            <div>
              <p style={{ fontFamily: font, fontSize: 15, fontWeight: 600, color: C.ink, margin: 0 }}>{t.lessons[key]}</p>
              <p style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, margin: 0 }}>{done ? t.completed : locked ? t.lockedQuiz : t.available}</p>
            </div>
          </div>
        );
      })}

      {doneCount === LESSON_ORDER.length && (
        <div style={{ textAlign: "center", marginTop: 24 }}>
          <Stamp label={unit.level} />
          <p style={{ fontFamily: font, fontSize: 16, color: C.ink, marginTop: 10, fontWeight: 700 }}>{t.unitComplete}</p>
        </div>
      )}
    </div>
  );
}

// ---------------- DASHBOARD DE MASTER ----------------
function AdminDashboard({ t, onLogout }) {
  const [students, setStudents] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [progressByStudent, setProgressByStudent] = useState({});
  const LEVELS = ["A1", "A2", "B1", "B2"];

  useEffect(() => {
    (async () => {
      const snap = await window.__db.collection("users").get();
      const list = snap.docs
        .map((d) => ({ uid: d.id, ...d.data() }))
        .filter((u) => u.role === "student");
      setStudents(list);
    })();
  }, []);

  const setLevel = async (student, level) => {
    await window.__db.collection("users").doc(student.uid).set({ level }, { merge: true });
    setStudents((prev) => prev.map((s) => (s.uid === student.uid ? { ...s, level } : s)));
  };

  const openProgress = async (student) => {
    if (expanded === student.uid) { setExpanded(null); return; }
    setExpanded(student.uid);
    if (!progressByStudent[student.uid]) {
      const snap = await window.__db.collection("users").doc(student.uid).collection("progress").get();
      const data = {};
      snap.docs.forEach((d) => { data[d.id] = d.data(); });
      setProgressByStudent((prev) => ({ ...prev, [student.uid]: data }));
    }
  };

  return (
    <div style={{ background: C.bg, minHeight: "100vh", padding: "24px 18px", boxSizing: "border-box" }}>
      <button onClick={onLogout} style={{ position: "absolute", top: 18, right: 18, fontFamily: mono, fontSize: 12, color: C.inkSoft, background: "none", border: "none", cursor: "pointer" }}>
        {t.logout}
      </button>
      <div style={{ maxWidth: 640, margin: "0 auto", paddingTop: 20 }}>
        <h1 style={{ fontFamily: font, fontSize: 26, color: C.ink, fontWeight: 800, marginBottom: 4 }}>Panel de administración</h1>
        <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft, marginBottom: 24 }}>{students ? `${students.length} estudiantes` : "Cargando..."}</p>

        {students && students.length === 0 && (
          <p style={{ fontFamily: font, fontSize: 14, color: C.inkSoft }}>
            Todavía no hay estudiantes. Créalos con <code>node create_students.js</code> desde tu repositorio.
          </p>
        )}

        {students && students.map((s) => (
          <div key={s.uid} style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, marginBottom: 10, overflow: "hidden" }}>
            <div style={{ padding: "14px 16px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }} onClick={() => openProgress(s)}>
              <div>
                <p style={{ fontFamily: font, fontSize: 15, fontWeight: 700, color: C.ink, margin: 0 }}>{s.name || s.email}</p>
                <p style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, margin: 0 }}>{s.email}</p>
              </div>
              <span style={{ fontFamily: mono, fontSize: 12, color: C.inkSoft }}>{expanded === s.uid ? "▲" : "▼"}</span>
            </div>

            <div style={{ padding: "0 16px 14px" }}>
              <p style={{ fontFamily: mono, fontSize: 10, color: C.inkSoft, marginBottom: 6, letterSpacing: 1 }}>NIVEL HABILITADO (solo uno)</p>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {LEVELS.map((lvl) => {
                  const selected = s.level === lvl;
                  const lc = LEVEL_COLORS[lvl];
                  return (
                    <button key={lvl} onClick={(e) => { e.stopPropagation(); setLevel(s, lvl); }}
                      style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, padding: "6px 14px", borderRadius: 999,
                        border: `1.5px solid ${selected ? lc.main : C.line}`, background: selected ? lc.soft : "#fff",
                        color: selected ? C.ink : C.inkSoft, cursor: "pointer" }}>
                      {lvl} {selected ? "✓" : ""}
                    </button>
                  );
                })}
              </div>
            </div>

            {expanded === s.uid && (
              <div style={{ borderTop: `1px solid ${C.line}`, padding: 16, background: C.cream }}>
                {!progressByStudent[s.uid] && <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft }}>{t.loading}</p>}
                {progressByStudent[s.uid] && Object.keys(progressByStudent[s.uid]).length === 0 && (
                  <p style={{ fontFamily: font, fontSize: 13, color: C.inkSoft }}>Sin actividad todavía.</p>
                )}
                {progressByStudent[s.uid] && Object.entries(progressByStudent[s.uid]).map(([unitId, p]) => (
                  <div key={unitId} style={{ marginBottom: 12 }}>
                    <p style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: C.ink, marginBottom: 4 }}>{unitId}</p>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 6 }}>
                      {LESSON_ORDER.map((k) => (
                        <span key={k} style={{ fontFamily: mono, fontSize: 10, padding: "2px 8px", borderRadius: 999,
                          background: p[k] ? C.ink : "#fff", color: p[k] ? "#fff" : C.inkSoft, border: `1px solid ${C.line}` }}>
                          {k}
                        </span>
                      ))}
                    </div>
                    {p.writing_text && (
                      <div style={{ background: "#fff", borderRadius: 8, padding: 10, marginTop: 4 }}>
                        <p style={{ fontFamily: font, fontSize: 12, color: C.inkSoft, marginBottom: 4 }}>Writing enviado:</p>
                        <p style={{ fontFamily: font, fontSize: 13, color: C.ink, whiteSpace: "pre-wrap" }}>{p.writing_text}</p>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [ready, setReady] = useState(!!window.__firebaseReady);
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null); // { role, enabledLevels, ... }
  const [units, setUnits] = useState(null);
  const [activeUnit, setActiveUnit] = useState(null);
  const [activeLesson, setActiveLesson] = useState(null);
  const [progress, setProgress] = useState({});
  const [allProgress, setAllProgress] = useState(null); // progreso de TODAS las unidades, para la barra general
  const [lang, setLang] = useState("en");
  const t = STRINGS[lang];

  useEffect(() => {
    if (window.__firebaseReady) { setReady(true); return; }
    const h = () => setReady(true);
    window.addEventListener("firebase-ready", h);
    return () => window.removeEventListener("firebase-ready", h);
  }, []);

  useEffect(() => {
    if (!ready) return;
    return window.__auth.onAuthStateChanged((u) => { setUser(u); setProfile(null); });
  }, [ready]);

  useEffect(() => {
    if (!user || profile) return;
    (async () => {
      const snap = await window.__db.collection("users").doc(user.uid).get();
      setProfile(snap.exists ? snap.data() : { role: "unknown" });
    })();
  }, [user]);

  useEffect(() => {
    if (!user || units) return;
    (async () => {
      const snap = await window.__db.collection("units").get();
      setUnits(snap.docs.map((d) => d.data()));
    })();
  }, [user]);

  useEffect(() => {
    if (!user || profile?.role !== "student" || allProgress) return;
    (async () => {
      const snap = await window.__db.collection("users").doc(user.uid).collection("progress").get();
      const data = {};
      snap.docs.forEach((d) => { data[d.id] = d.data(); });
      setAllProgress(data);
    })();
  }, [user, profile]);

  const openUnit = async (u) => {
    setActiveUnit(u);
    const cached = allProgress && allProgress[u.unit_id];
    setProgress(cached || {});
    const ref = window.__db.collection("users").doc(user.uid).collection("progress").doc(u.unit_id);
    const snap = await ref.get();
    setProgress(snap.exists ? snap.data() : {});
  };

  const markComplete = async (key, extra) => {
    const next = { ...progress, [key]: true, ...(extra || {}) };
    setProgress(next);
    setAllProgress((prev) => ({ ...(prev || {}), [activeUnit.unit_id]: next }));
    const ref = window.__db.collection("users").doc(user.uid).collection("progress").doc(activeUnit.unit_id);
    await ref.set({ [key]: true, ...(extra || {}) }, { merge: true });
    setActiveLesson(null);
  };

  if (!ready) return <div style={{ padding: 40, fontFamily: font, textAlign: "center" }}>{STRINGS.en.loading}</div>;
  if (!user) return <LoginScreen t={t} />;
  if (!profile) return <div style={{ padding: 40, fontFamily: font, textAlign: "center" }}>{t.loading}</div>;
  if (profile.role === "master") return <AdminDashboard t={t} onLogout={() => window.__auth.signOut()} />;
  if (!units || !allProgress) return <div style={{ padding: 40, fontFamily: font, textAlign: "center" }}>{t.loading}</div>;

  const visibleUnits = units.filter((u) => u.level === profile.level);
  const levelColor = activeUnit ? LEVEL_COLORS[activeUnit.level] : null;

  const unitsDone = visibleUnits.filter((u) => {
    const p = allProgress[u.unit_id] || {};
    return LESSON_ORDER.every((k) => p[k]);
  }).length;
  const overallProgress = {
    level: profile.level,
    unitsDone,
    unitsTotal: visibleUnits.length,
    pct: visibleUnits.length ? Math.round((unitsDone / visibleUnits.length) * 100) : 0,
  };

  return (
    <div style={{ background: C.bg, minHeight: "100vh", boxSizing: "border-box" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 18px", borderBottom: `1px solid ${C.line}`, background: "#fff" }}>
        <button onClick={() => { setActiveUnit(null); setActiveLesson(null); }}
          style={{ fontFamily: font, fontSize: 13, fontWeight: 700, color: C.ink, background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
          🏠 {t.home}
        </button>
        {activeUnit && (
          <button onClick={() => setActiveLesson(null)}
            style={{ fontFamily: font, fontSize: 13, fontWeight: 700, color: levelColor.main, background: "none", border: "none", cursor: "pointer" }}>
            {t.unit.toUpperCase()} · {activeUnit.unit_id}
          </button>
        )}
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {!(activeLesson === "quiz") && (
            <button onClick={() => setLang((l) => (l === "en" ? "es" : "en"))}
              style={{ fontFamily: mono, fontSize: 11, fontWeight: 700, padding: "5px 10px", borderRadius: 999, border: `1px solid ${C.line}`, background: "#fff", color: C.ink, cursor: "pointer" }}>
              {lang === "en" ? "ES" : "EN"}
            </button>
          )}
          <button onClick={() => window.__auth.signOut()}
            style={{ fontFamily: mono, fontSize: 11, color: C.inkSoft, background: "none", border: "none", cursor: "pointer" }}>
            {t.logout}
          </button>
        </div>
      </div>
      <div style={{ padding: "24px 18px" }}>
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        {!activeUnit && <LevelsScreen units={visibleUnits} t={t} name={profile.name} overallProgress={overallProgress} onOpenUnit={openUnit} />}
        {activeUnit && !activeLesson && (
          <UnitMap unit={activeUnit} levelColor={levelColor} progress={progress} t={t}
            onOpenLesson={(k) => setActiveLesson(k)} onBack={() => setActiveUnit(null)} />
        )}
        {activeUnit && activeLesson && (
          <div>
            <button onClick={() => setActiveLesson(null)} style={{ border: "none", background: "none", padding: 0, color: C.inkSoft, fontFamily: font, fontSize: 14, cursor: "pointer", marginBottom: 16 }}>
              ← {activeUnit.title}
            </button>
            {activeLesson === "vocab" && <VocabLesson unit={activeUnit} levelColor={levelColor} t={t} onComplete={() => markComplete("vocab")} />}
            {activeLesson === "grammar" && <GrammarLesson unit={activeUnit} levelColor={levelColor} t={t} onComplete={() => markComplete("grammar")} />}
            {activeLesson === "reading" && <ReadingLesson unit={activeUnit} levelColor={levelColor} t={t} onComplete={() => markComplete("reading")} />}
            {activeLesson === "listening" && <ListeningLesson unit={activeUnit} levelColor={levelColor} t={t} onComplete={() => markComplete("listening")} />}
            {activeLesson === "writing" && <WritingLesson unit={activeUnit} levelColor={levelColor} t={t} lang={lang} onComplete={(text) => markComplete("writing", { writing_text: text, writing_submitted_at: new Date().toISOString() })} />}
            {activeLesson === "quiz" && <QuizLesson unit={activeUnit} levelColor={levelColor} t={t} onComplete={(score) => markComplete("quiz", { quiz_score: score })} />}
          </div>
        )}
      </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
